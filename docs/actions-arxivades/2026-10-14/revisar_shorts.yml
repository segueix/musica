name: Revisar Shorts

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  revisar_i_corregir:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del codi
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Instal·lar dependències
        run: npm ci

      - name: Executar verificació de Shorts
        run: node scripts/revisar_shorts.js

      - name: Fer commit i push dels canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/falsos-shorts.json
          if git diff --staged --quiet; then
            echo "Sense canvis a publicar."
            exit 0
          fi
          git commit -m "chore: revisa falsos Shorts"
          git pull --rebase origin main
          git push origin HEAD:main
