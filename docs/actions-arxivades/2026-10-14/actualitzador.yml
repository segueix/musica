name: Actualitzador feed musical (manual)

on:
  workflow_dispatch:
    inputs:
      discografia_sencera:
        description: "Llegeix la discografia sencera de tots els canals Tema (si no, una setena part cada dia)"
        type: boolean
        default: false

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  actualitza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Sincronitza main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Genera feed musical
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: "50"
          # El mateix mode que el workflow diari (actualitzar-feed-musica.yml): si no, el feed manual tornaria a
          # posar el que el filtre del canal Tema treu.
          MUSIC_TOPIC_GOVERNANCE: "apply"
          MUSIC_TOPIC_FULL_READ: ${{ inputs.discografia_sencera && '1' || '0' }}
        run: node scripts/update_music_feed.js
      - name: Publica feed
        # data/revisio-idiomes.json: les cançons noves pendents de revisar l'idioma (i les descartades).
        # Si main ha canviat mentrestant: git pull --rebase i es torna a provar (no es perd la quota gastada).
        run: >-
          bash scripts/publicar_dades.sh "data: actualitza feed musical"
          data/feed.json js/channels-ca.json data/music-feed-audit.json data/revisio-idiomes.json data/hidden-videos.json
          data/music-topic-catalog.json data/music-topic-review.json

