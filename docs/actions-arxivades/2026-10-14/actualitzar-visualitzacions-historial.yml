name: Actualitzar visualitzacions historial musical

on:
  schedule:
    - cron: "23 9 * * 0"
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  estadistiques:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sincronitza main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Actualitza només visualitzacions de l'historial
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: node scripts/update_music_history_views.js

      - name: Publica comptadors i vídeos restringits si han canviat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/archive/channels data/history-pool.json data/historial-musical.json
          [ -f data/videos-restringits.json ] && git add data/videos-restringits.json
          if git diff --cached --quiet; then
            echo "Sense canvis de visualitzacions."
            exit 0
          fi
          git commit -m "data: actualitza visualitzacions de l'historial musical"
          git push origin HEAD:main
