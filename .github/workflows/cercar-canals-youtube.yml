name: Cercar canals YouTube

# Manteniment programat o execució manual explícita. Cap push ni encadenament.
on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  cerca:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Sincronitza main
        run: git pull --ff-only origin main
      - name: Resol canals verificats i cerca candidats
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: |
          node scripts/resoldre_canals_verificats.js
          node scripts/cercar_canals_youtube.js --limit=25
      - name: Valida la base
        run: node scripts/validar_artistes_musica.js
      - name: Desa els canals; no activa el feed
        run: >-
          bash scripts/publicar_dades.sh "data: resol canals YouTube verificats" data/artistes-musica.json
