name: Revisar Shorts

# Estalvi provisional d’octubre de 2026: només manual. Revisar el calendari l’1 de novembre.
# Vegeu docs/ESTALVI_ACTIONS_OCTUBRE_2026.md; no es reactiva automàticament.
on:
  workflow_dispatch:

concurrency:
  group: music-data-writer
  queue: max
  cancel-in-progress: false

jobs:
  revisar_i_corregir:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout del codi
        uses: actions/checkout@v5
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Executar verificació de Shorts
        run: node scripts/revisar_shorts.js

      - name: Fer commit i push dels canvis
        run: >-
          bash scripts/publicar_dades.sh "chore: revisa falsos Shorts" data/feed.json data/falsos-shorts.json
