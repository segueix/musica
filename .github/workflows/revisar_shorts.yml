name: Revisar Shorts (manual)

# Sense schedule fins que Música tingui feed i API propis.
on:
  workflow_dispatch:

jobs:
  revisar_i_corregir:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del codi
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instal·lar dependències si n'hi ha
        run: npm ci || echo "No package-lock.json, saltant instal·lació"

      - name: Executar verificació de Shorts
        run: node scripts/revisar_shorts.js

      - name: Fer Commit i Push dels canvis
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/falsos-shorts.json

          if git diff --staged --quiet; then
            echo "Sense canvis a publicar."
          else
            git commit -m "chore: revisa falsos Shorts"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
