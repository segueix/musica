name: Revisar Shorts
on:
  workflow_dispatch: # Permet executar-ho manualment des de GitHub
  schedule:
    - cron: '0 3 * * *' # Executa cada dia a les 03:00 UTC

jobs:
  revisar_i_corregir:
    runs-on: ubuntu-latest
    # S'executa tant manualment com en execució programada
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' }}
    
    steps:
      - name: Checkout del codi
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instal·lar dependències si n'hi ha
        run: npm ci || echo "No package-lock.json, saltant instal·lació"

      - name: Executar verificació de Shorts
        run: node scripts/revisar_shorts.js

      - name: Fer Commit i Push dels canvis
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json data/falsos-shorts.json

          # Només fa el commit si hi ha canvis preparats
          if git diff --staged --quiet; then
            echo "Sense canvis a publicar."
          else
            git commit -m "🤖 Auto-correcció de falsos Shorts"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
