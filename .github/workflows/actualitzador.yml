name: Actualitzador feed musical (manual)

on:
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  actualitza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Sincronitza main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Genera feed musical
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: "50"
        run: node scripts/update_music_feed.js
      - name: Publica feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json js/channels-ca.json data/music-feed-audit.json
          if git diff --cached --quiet; then
            echo "Feed sense canvis."
            exit 0
          fi
          git commit -m "data: actualitza feed musical"
          git push origin HEAD:main
