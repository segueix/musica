name: Actualitzador feed musical (manual)

on:
  push:
    paths:
      - ".github/workflows/actualitzador.yml"
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: true

jobs:
  actualitza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Sincronitza main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Genera feed musical
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: "50"
          # El mateix mode que el workflow diari (actualitzar-feed-musica.yml): si no, el feed manual tornaria a
          # posar el que el filtre del canal Tema treu.
          MUSIC_TOPIC_GOVERNANCE: "apply"
          MUSIC_TARGET_CHANNELS: "UCDbEp5W8Obkk2YmYtWB-F5A"
        run: node scripts/update_music_feed.js
      - name: Publica feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # data/revisio-idiomes.json: les cançons noves pendents de revisar l'idioma (i les descartades).
          git add data/feed.json js/channels-ca.json data/music-feed-audit.json data/revisio-idiomes.json data/music-topic-catalog.json data/music-topic-review.json
          if git diff --cached --quiet; then
            echo "Feed sense canvis."
            exit 0
          fi
          git commit -m "data: actualitza feed musical"
          git push origin HEAD:main
