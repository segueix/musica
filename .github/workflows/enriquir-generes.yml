name: Enriquir gèneres musicals

# Manteniment programat o execució manual explícita. Cap push ni encadenament.
# Estalvi provisional d’octubre de 2026: només manual. Revisar el calendari l’1 de novembre.
# Vegeu docs/ESTALVI_ACTIONS_OCTUBRE_2026.md; no es reactiva automàticament.
on:
  workflow_dispatch:

concurrency:
  group: music-data-writer
  queue: max
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  generes:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Sincronitza main
        run: git pull --ff-only origin main
      - name: Enriqueix i valida
        run: |
          node scripts/enriquir_generes_musica.js
          node scripts/validar_artistes_musica.js
          node scripts/generar_afinitats_musica.js --repair-catalog
      - name: Desa les dades; la publicació espera al torn diari
        run: >-
          bash scripts/publicar_dades.sh "data: actualitza gèneres musicals" data js/channels-ca.json js/features/music-affinity-catalog.js
