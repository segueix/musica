name: Enriquir gèneres musicals

on:
  push:
    paths:
      - "data/music-genres.json"
      - "scripts/enriquir_generes_musica.js"
      - ".github/workflows/enriquir-generes.yml"
  schedule:
    - cron: "17 6 * * 0"
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  generes:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sincronitza amb l'últim main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Enriqueix gèneres
        run: node scripts/enriquir_generes_musica.js

      - name: Valida la base
        run: node scripts/validar_artistes_musica.js

      - name: Publica canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/artistes-musica.json

          if git diff --cached --quiet; then
            echo "Sense canvis de gèneres."
            exit 0
          fi

          git commit -m "data: actualitza gèneres musicals"
          git push origin HEAD:main
