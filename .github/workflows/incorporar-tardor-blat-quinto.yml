name: Incorporar Tardor, Alex Blat i Quinto
on:
  push:
    branches: [main]
    paths: ['.github/workflows/incorporar-tardor-blat-quinto.yml']
  workflow_dispatch:
concurrency:
  group: music-data-writer
  cancel-in-progress: false
jobs:
  incorporar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Instal·la dependències i conserva el catàleg anterior
        run: |
          npm ci
          cp js/channels-ca.json /tmp/channels-before.json
      - name: Aplica només les tres altes revisades
        run: |
          node --check scripts/revisions/incorporar_tardor_blat_quinto.js
          node scripts/revisions/incorporar_tardor_blat_quinto.js
          node scripts/documentar_vigilancia_idiomes.js
          node scripts/purgar_canals_feed.js
          node scripts/aplicar_revisio_manual_musical.js > /tmp/manual-before.log
          npm run music:validate
      - name: Prova les exclusions i el tipus de gravació
        run: |
          node - <<'NODE'
          const assert=require('node:assert/strict');
          const {CONFIG,KNOWN_BILINGUAL,exclusion,contentType}=require('./scripts/revisions/incorporar_tardor_blat_quinto.js');
          const [t,b,q]=CONFIG;
          const v=(id,title,channelId,description='')=>({id,title,channelId,description,duration:'PT3M',embeddable:true});
          for(const id of KNOWN_BILINGUAL) assert(exclusion(t,{id:t.topic},v(id,'',t.topic)));
          assert.equal(exclusion(t,{id:t.topic},v('q1SqBfyayUw','Nevar a València',t.topic)),null);
          assert(exclusion(q,{id:q.topic},v('5q-9YyMkff4','PLAN',q.topic,'Alex Quinto Fernandez Atlas Club')));
          assert(exclusion(q,{id:q.topic},v('5q-9YyMkff4','LLUM',q.topic,'Alex Quinto Fernandez Atlas Club')));
          assert.equal(exclusion(q,{id:q.topic},v('WRdYU14R1D4','LLUM',q.topic,"Josep Quinto Mengual Primavera d'Hivern")),null);
          assert(exclusion(q,{id:q.topic},v('WRdYU14R1D4','LLUM','UCbJVlPOepjJiteagmmSaoTA',"Josep Quinto Mengual Primavera d'Hivern")));
          assert.equal(contentType(v('8KeF3Je5Zas','A la vida',b.official)),'live_song');
          assert.equal(new Set(CONFIG.flatMap(c=>[c.official,c.topic])).size,6);
          console.log('11 comprovacions específiques superades.');
          NODE
          node scripts/test_music_content_classifier.js
      - name: Sincronitza exclusivament els sis canals seleccionats
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: '50'
          MUSIC_TOPIC_GOVERNANCE: apply
          MUSIC_TOPIC_FULL_READ: '1'
        run: |
          test -n "$MUSIC_TARGET_CHANNELS"
          node scripts/update_music_feed.js
          node scripts/aplicar_revisio_manual_musical.js > /tmp/manual-after.log
      - name: Regenera historial, cerca i pàgines compartides
        run: |
          node scripts/archivar_feed_musical.js
          npm run search:index:hybrid:rebuild
          node scripts/generar_pagines_compartir.js
          node scripts/documentar_vigilancia_idiomes.js
          node scripts/documentar_vigilancia_idiomes.js --check
      - name: Executa totes les proves i contrasta qualsevol fallada amb HEAD
        run: |
          node scripts/revisions/provar_altes_musicals.js
      - name: Comprova el resultat publicable i preserva la resta del catàleg
        run: |
          node scripts/revisions/incorporar_tardor_blat_quinto.js --verify
          node - <<'NODE'
          const fs=require('fs');
          const assert=require('node:assert/strict');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const before=read('/tmp/channels-before.json').channels;
          const after=read('js/channels-ca.json').channels;
          const current=new Set(after.map(c=>c.id));
          for(const c of before) if(c.id!=='UC9zX7R05JQ1P30RGvtjHizQ') assert(current.has(c.id),'S’ha perdut un canal aliè a aquestes altes: '+c.id);
          const tests=read('/tmp/tardor-blat-quinto-validation.json');
          assert.equal(tests.regressions,0);
          const p='docs/revisions/2026-10-12-tardor-blat-quinto.json';
          const r=read(p);
          r.validation={...tests,artistBase:'passed',languageWatchDocument:'passed',previousChannelsPreserved:true,channelsBefore:before.length,channelsAfter:after.length};
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,'## Alta musical\n\n'+r.artists.map(a=>a.name+' — '+a.origin+': '+a.recordingsPublished+' enregistraments.').join('\n\n')+'\n\nProves superades: '+tests.passedTests+'. Fallades preexistents: '+tests.failedTests+'. Regressions: 0.\n');
          NODE
      - name: Publica les altes i tots els derivats junts
        run: |
          bash scripts/publicar_dades.sh 'feat: indexa Tardor, Àlex Blat i Quinto amb repertori català verificat' data js/channels-ca.json compartir docs/ARTISTES_VIGILATS_IDIOMA.md docs/revisions/2026-10-12-tardor-blat-quinto.json
      - name: Conserva el diagnòstic si alguna prova falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-altes-musicals
          path: |
            /tmp/tardor-blat-quinto-tests.json
            /tmp/tardor-blat-quinto-baseline-tests.json
            /tmp/tardor-blat-quinto-validation.json
            docs/revisions/2026-10-12-tardor-blat-quinto.json
          retention-days: 1
