name: Incorporar Tardor, Alex Blat i Quinto
on:
  push:
    branches: [main]
    paths: ['.github/workflows/incorporar-tardor-blat-quinto.yml']
  workflow_dispatch:
concurrency:
  group: music-data-writer
  cancel-in-progress: false
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - name: Extreu les evidències sense consultar YouTube
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const r=JSON.parse(fs.readFileSync('docs/revisions/2026-10-12-tardor-blat-quinto-descoberta.json','utf8'));
          const o=JSON.parse(fs.readFileSync('data/origens-artistes.json','utf8'));
          const lines=[];
          for(const a of r.artists){
            lines.push('# '+a.name,JSON.stringify(a.existingArtists));
            for(const c of a.channels){
              lines.push('## '+c.id+' '+c.name);
              for(const v of c.videos){
                lines.push('### '+v.id+' '+v.title);
                const d=String(v.description||'');
                const full=c.id===a.officialId && a.name!=='Tardor';
                lines.push((full?d:d.slice(0,1200)).replace(/\r?\n/g,' ⏎ '));
              }
            }
          }
          lines.push('# Llocs existents');
          lines.push(JSON.stringify(Object.entries(o.places).filter(([id,p])=>['València','Valencia','Benidorm','Pego'].includes(p.name)),null,2));
          fs.writeFileSync('docs/revisions/2026-10-12-tardor-blat-quinto-detalls.md',lines.join('\n')+'\n');
          NODE
      - name: Desa els detalls de revisió
        run: |
          bash scripts/publicar_dades.sh 'docs: crèdits i evidències dels tres artistes' docs/revisions/2026-10-12-tardor-blat-quinto-detalls.md
