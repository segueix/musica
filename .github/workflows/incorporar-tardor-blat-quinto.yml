name: Incorporar Tardor, Alex Blat i Quinto

on:
  push:
    branches: [main]
    paths: ['.github/workflows/incorporar-tardor-blat-quinto.yml']
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Verifica identitat, canals Tema i enregistraments
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const key = process.env.YOUTUBE_API_KEY_SERVER;
          if (!key) throw new Error('Falta la clau de YouTube');
          const targets = [
            { name: 'Tardor', handle: '@tardor-band', anchor: 'Nevar a València' },
            { name: 'Àlex Blat', handle: '@alexblatmusica', anchor: 'Que bé fer res' },
            { name: 'Quinto', handle: '@quinto__v', anchor: 'Petjades' },
          ];
          const norm = s => String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
          let quota = 0;
          async function api(endpoint, args) {
            quota += endpoint === 'search' ? 100 : 1;
            const u = new URL('https://www.googleapis.com/youtube/v3/' + endpoint);
            Object.entries({...args, key}).forEach(([k,v]) => u.searchParams.set(k, String(v)));
            const r = await fetch(u, {signal: AbortSignal.timeout(30000)});
            const j = await r.json();
            if (!r.ok) throw new Error(endpoint + ': ' + (j.error?.message || r.status));
            return j;
          }
          const report = {reviewedOn: new Date().toISOString(), artists: []};
          const base = JSON.parse(fs.readFileSync('data/artistes-musica.json', 'utf8'));
          const origins = JSON.parse(fs.readFileSync('data/origens-artistes.json', 'utf8'));
          for (const t of targets) {
            const official = (await api('channels', {part:'snippet,contentDetails,statistics', forHandle:t.handle})).items?.[0];
            if (!official) throw new Error('No es resol ' + t.handle);
            const candidates = new Set([official.id]);
            const searchResults = [];
            for (const args of [
              {type:'channel', q:t.name + ' - Topic'},
              {type:'video', q:t.name + ' ' + t.anchor},
            ]) {
              const found = (await api('search', {part:'snippet', maxResults:15, ...args})).items || [];
              for (const x of found) {
                const id = x.id.channelId || x.snippet.channelId;
                const title = x.id.channelId ? x.snippet.title : x.snippet.channelTitle;
                searchResults.push({id, title, videoId:x.id.videoId || null, videoTitle:x.id.videoId ? x.snippet.title : null});
                const stripped = norm(title).replace(/ (topic|tema)$/, '');
                if (stripped === norm(t.name) || id === official.id) candidates.add(id);
              }
            }
            if (candidates.size > 8) throw new Error('Massa homònims per a ' + t.name);
            const metadata = (await api('channels', {part:'snippet,contentDetails,statistics', id:[...candidates].join(',')})).items || [];
            const entry = {...t, officialId:official.id, searchResults, channels:[], existingArtists:base.artists.filter(a => [a.name, a.displayName, ...(a.aliases || [])].some(n => norm(n) === norm(t.name))), originPlaces:Object.entries(origins.places).filter(([id,p]) => JSON.stringify(p).includes(t.name === 'Quinto' ? 'Pego' : 'València'))};
            for (const c of metadata) {
              const videos = [];
              let token;
              for (let page=0;page<4;page++) {
                const r = await api('playlistItems', {part:'snippet,contentDetails', playlistId:c.contentDetails.relatedPlaylists.uploads, maxResults:50, ...(token ? {pageToken:token} : {})});
                const ids = (r.items || []).map(v => v.contentDetails.videoId);
                if (ids.length) {
                  const details = (await api('videos', {part:'snippet,contentDetails,status,statistics', id:ids.join(',')})).items || [];
                  for (const v of details) videos.push({id:v.id,title:v.snippet.title,channelId:v.snippet.channelId,publishedAt:v.snippet.publishedAt,duration:v.contentDetails.duration,embeddable:v.status.embeddable,viewCount:Number(v.statistics.viewCount || 0),description:v.snippet.description,defaultAudioLanguage:v.snippet.defaultAudioLanguage || null,regionRestriction:v.contentDetails.regionRestriction || null});
                }
                token = r.nextPageToken;
                if (!token) break;
              }
              entry.channels.push({id:c.id,name:c.snippet.title,handle:c.snippet.customUrl || null,description:c.snippet.description,avatar:c.snippet.thumbnails?.high?.url || c.snippet.thumbnails?.default?.url || '',subscriberCount:Number(c.statistics.subscriberCount || 0),complete:!token,videos});
              console.log(JSON.stringify({artist:t.name,channel:c.snippet.title,id:c.id,count:videos.length,complete:!token}));
            }
            report.artists.push(entry);
          }
          report.estimatedQuotaUnits = quota;
          const file = 'docs/revisions/2026-10-12-tardor-blat-quinto-descoberta.json';
          fs.writeFileSync(file, JSON.stringify(report, null, 2) + '\n');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, 'Canals i vídeos identificats. Sense modificar encara el catàleg. Quota estimada: ' + quota + '.\n');
          NODE
      - name: Desa la verificació
        run: bash scripts/publicar_dades.sh 'docs: verifica canals de Tardor, Àlex Blat i Quinto' docs/revisions/2026-10-12-tardor-blat-quinto-descoberta.json
