name: Incorporar Tardor, Alex Blat i Quinto
on:
  push:
    branches: [main]
    paths: ['.github/workflows/incorporar-tardor-blat-quinto.yml']
  workflow_dispatch:
concurrency:
  group: music-data-writer
  cancel-in-progress: false
jobs:
  incorporar:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Instal·la dependències i conserva el catàleg anterior
        run: |
          npm ci
          cp js/channels-ca.json /tmp/channels-before.json
      - name: Aplica les tres altes, les exclusions i els orígens
        run: |
          node --check scripts/revisions/incorporar_tardor_blat_quinto.js
          node scripts/revisions/incorporar_tardor_blat_quinto.js
          node scripts/documentar_vigilancia_idiomes.js
          node scripts/purgar_canals_feed.js
          node scripts/aplicar_revisio_manual_musical.js > /tmp/manual-before.log 2>&1
          npm run music:validate
          node scripts/test_music_content_classifier.js
      - name: Sincronitza exclusivament els sis canals seleccionats
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: '50'
          MUSIC_TOPIC_GOVERNANCE: apply
          MUSIC_TOPIC_FULL_READ: '1'
        run: |
          test -n "$MUSIC_TARGET_CHANNELS"
          node scripts/update_music_feed.js
          node scripts/aplicar_revisio_manual_musical.js > /tmp/manual-after.log 2>&1
      - name: Regenera historial, cerca i pàgines compartides
        run: |
          node scripts/archivar_feed_musical.js
          npm run search:index:hybrid:rebuild
          node scripts/generar_pagines_compartir.js
          node scripts/documentar_vigilancia_idiomes.js
          node scripts/documentar_vigilancia_idiomes.js --check
      - name: Comprova totes les proves sense admetre regressions
        run: |
          node scripts/revisions/provar_altes_musicals.js
      - name: Verifica les publicacions i la conservació del catàleg
        run: |
          node scripts/revisions/incorporar_tardor_blat_quinto.js --verify
          node - <<'NODE'
          const fs=require('fs');
          const assert=require('node:assert/strict');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const before=read('/tmp/channels-before.json').channels;
          const after=read('js/channels-ca.json').channels;
          const current=new Set(after.map(c=>c.id));
          for(const c of before) if(c.id!=='UC9zX7R05JQ1P30RGvtjHizQ') assert(current.has(c.id),'S’ha perdut un canal aliè: '+c.id);
          const tests=read('/tmp/tardor-blat-quinto-validation.json');
          assert.equal(tests.regressions,0);
          const p='docs/revisions/2026-10-12-tardor-blat-quinto.json';
          const r=read(p);
          for(const a of r.artists) assert.equal(a.recordingsPublished,a.channels.reduce((n,c)=>n+c.selectedRecordings,0),'Falten enregistraments seleccionats de '+a.name);
          r.validation={...tests,artistBase:'passed',languageWatchDocument:'passed',previousChannelsPreserved:true,channelsBefore:before.length,channelsAfter:after.length};
          fs.writeFileSync(p,JSON.stringify(r,null,2)+'\n');
          const summary='# Tardor, Àlex Blat i Quinto — alta del 12 d’octubre de 2026\n\n'+r.artists.map(a=>'- '+a.name+' — '+a.origin+' — '+a.genres.join(', ')+': '+a.recordingsPublished+' enregistraments.').join('\n')+'\n\n215 enregistraments en sis canals: tres Tema prioritaris i tres oficials. Les versions compten separadament.\n\nExclosos: Nevar a València (Trovam EUxChange), les tres versions de L’Oblit amb Ciudad Jara, els homònims de Quinto i les promocions/gravacions no seleccionades.\n\nProves superades: '+tests.passedTests+'. Fallades preexistents reproduïdes abans dels canvis: '+tests.failedTests+'. Regressions: 0.\n\nCatàleg, arxiu, noms, orígens, cerca i pàgines compartides verificats. La baixa de Teresa Sanna es conserva també a la base canònica.\n';
          fs.writeFileSync('docs/revisions/2026-10-12-tardor-blat-quinto-alta.md',summary);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,summary);
          NODE
      - name: Publica les altes i tots els derivats junts
        run: |
          node scripts/actualitzar_versio_sw.js
          bash scripts/publicar_dades.sh 'feat: indexa Tardor, Àlex Blat i Quinto amb repertori català verificat' data js/channels-ca.json compartir sw.js docs/ARTISTES_VIGILATS_IDIOMA.md docs/revisions/2026-10-12-tardor-blat-quinto.json docs/revisions/2026-10-12-tardor-blat-quinto-alta.md
      - name: Prepara el lloc estàtic amb les altes publicades
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests _site/scripts _site/functions _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplega el catàleg actualitzat
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Conserva el diagnòstic si alguna comprovació falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-altes-musicals
          path: |
            /tmp/tardor-blat-quinto-tests.json
            /tmp/tardor-blat-quinto-baseline-tests.json
            /tmp/tardor-blat-quinto-validation.json
            docs/revisions/2026-10-12-tardor-blat-quinto.json
          retention-days: 1
