name: Actualitzar visualitzacions historial musical

# Estalvi provisional d’octubre de 2026: només manual. Revisar el calendari l’1 de novembre.
# Vegeu docs/ESTALVI_ACTIONS_OCTUBRE_2026.md; no es reactiva automàticament.
on:
  workflow_dispatch:

concurrency:
  group: music-data-writer
  queue: max
  cancel-in-progress: false

jobs:
  estadistiques:
    if: github.ref == 'refs/heads/main'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Sincronitza main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Actualitza només visualitzacions de l'historial
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: node scripts/update_music_history_views.js

      - name: Publica comptadors i vídeos restringits si han canviat
        run: >-
          bash scripts/publicar_dades.sh "data: actualitza visualitzacions de l'historial musical"
          data/archive/channels data/history-pool.json data/historial-musical.json data/videos-restringits.json
