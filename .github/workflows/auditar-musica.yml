name: Auditar elegibilitat musical\n\non:\n  push:\n    paths:\n      - "scripts/auditar_elegibilitat_musica.js"\n      - ".github/workflows/auditar-musica.yml"\n  workflow_dispatch:\n\nconcurrency:\n  group: music-data-writer\n  cancel-in-progress: false\n\njobs:\n  audita:\n    runs-on: ubuntu-latest\n    permissions:\n      contents: write\n    steps:\n      - uses: actions/checkout@v5\n      - uses: actions/setup-node@v5\n        with:\n          node-version: "20"\n      - name: Sincronitza main\n        run: |\n          git fetch origin main\n          git reset --hard origin/main\n      - name: Genera auditoria\n        run: node scripts/auditar_elegibilitat_musica.js\n      - name: Publica auditoria\n        run: |\n          git config user.name "github-actions[bot]"\n          git config user.email "github-actions[bot]@users.noreply.github.com"\n          git add data/artistes-musica-audit.json\n          if git diff --cached --quiet; then exit 0; fi\n          git commit -m "data: audita elegibilitat musical"\n          git push origin HEAD:main\n