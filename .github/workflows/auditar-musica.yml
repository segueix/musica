name: Auditar elegibilitat musical

on:
  push:
    paths:
      - "scripts/auditar_elegibilitat_musica.js"
      - ".github/workflows/auditar-musica.yml"
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  audita:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Sincronitza main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Genera auditoria
        run: node scripts/auditar_elegibilitat_musica.js
      - name: Publica auditoria
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/artistes-musica-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "data: audita elegibilitat musical"
          git push origin HEAD:main
