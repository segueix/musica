name: Fetus one-off feed

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/tmp-fetus-oneoff.yml"

concurrency:
  group: fetus-oneoff-feed
  cancel-in-progress: true

jobs:
  actualitza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Sincronitza main
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Genera només Fetus
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: "50"
          MUSIC_TOPIC_GOVERNANCE: "apply"
          MUSIC_TARGET_CHANNELS: "UCDbEp5W8Obkk2YmYtWB-F5A"
        run: node scripts/update_music_feed.js
      - name: Publica Fetus al feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json js/channels-ca.json data/music-feed-audit.json data/revisio-idiomes.json data/music-topic-catalog.json data/music-topic-review.json
          if git diff --cached --quiet; then
            echo "Feed sense canvis."
            exit 0
          fi
          git commit -m "data: incorpora Fetus al feed musical"
          git pull --rebase origin main
          git push origin HEAD:main
