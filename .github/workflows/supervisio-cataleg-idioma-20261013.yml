name: Supervisio general llengua principal
on:
  push:
    branches: [main]
    paths: ['.github/workflows/supervisio-cataleg-idioma-20261013.yml']
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: music-data-writer
  cancel-in-progress: false
jobs:
  publicar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Prepara la validacio
        run: |
          npm ci > /tmp/supervisio-install.log 2>&1
          node --check scripts/revisions/supervisar_idioma_20261013.js
      - name: Aplica nomes les decisions documentades
        run: |
          node scripts/revisions/supervisar_idioma_20261013.js
          npm run music:validate
      - name: Regenera cerca i comparticio sense consultar YouTube
        run: |
          npm run search:index:hybrid:rebuild
          node scripts/generar_pagines_compartir.js
          node scripts/revisions/supervisar_idioma_20261013.js --verify
      - name: Prova les exclusions i els casos que cal conservar
        run: |
          npx vitest run tests/supervisio-idioma-20261013.test.js tests/animal-idioma.test.js tests/channel-video-allowlist.test.js tests/revisio-idiomes.test.js
      - name: Compara la suite completa amb la linia base
        run: |
          node scripts/revisions/provar_altes_musicals.js > /tmp/supervisio-tests.log 2>&1 || { tail -n 40 /tmp/supervisio-tests.log; exit 1; }
          tail -n 1 /tmp/supervisio-tests.log
      - name: Verifica preservacio i compara els diagnostics de codi
        run: |
          node scripts/revisions/supervisar_idioma_20261013.js --verify
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const {spawnSync,execFileSync}=require('node:child_process');
          const root=process.cwd(), baseline='/tmp/musica-abans-altes';
          function lint(cwd) {
            const r=spawnSync(process.execPath,[path.join(root,'node_modules/eslint/bin/eslint.js'),'js/**/*.js','--format','json'],{cwd,encoding:'utf8',maxBuffer:8*1024*1024});
            if(r.error || ![0,1].includes(r.status)) throw Error('No es pot executar ESLint');
            return JSON.parse(r.stdout).map(f=>({file:path.relative(cwd,f.filePath),errors:f.errorCount,warnings:f.warningCount,messages:f.messages}));
          }
          if(!fs.existsSync(baseline)) {
            execFileSync('git',['worktree','add','--detach',baseline,'HEAD']);
            fs.symlinkSync(path.join(root,'node_modules'),path.join(baseline,'node_modules'),'dir');
          }
          const current=lint(root);
          assert.deepEqual(current,lint(baseline),'ESLint ha detectat diagnostics nous');
          const validation=JSON.parse(fs.readFileSync('/tmp/tardor-blat-quinto-validation.json','utf8'));
          const prefix='docs/revisions/2026-10-13-supervisio-idioma-resultat';
          const report=JSON.parse(fs.readFileSync(prefix+'.json','utf8'));
          report.tests={passed:validation.passedTests,preexistingFailures:validation.failedTests,regressions:validation.regressions};
          report.lint={preexistingErrors:current.reduce((n,f)=>n+f.errors,0),preexistingWarnings:current.reduce((n,f)=>n+f.warnings,0),newDiagnostics:0};
          report.baselineCommit=execFileSync('git',['rev-parse','HEAD'],{encoding:'utf8'}).trim();
          fs.writeFileSync(prefix+'.json',JSON.stringify(report,null,2)+'\n');
          fs.appendFileSync(prefix+'.md','\nProves: '+report.tests.passed+' superades; '+report.tests.preexistingFailures+' fallades anteriors reproduïdes; '+report.tests.regressions+' regressions. ESLint: cap diagnòstic nou.\n');
          console.log(JSON.stringify({tests:report.tests,lint:report.lint}));
          NODE
      - name: Publica sense sobreescriure canvis concurrents
        run: |
          node scripts/actualitzar_versio_sw.js
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/hidden-videos.json data/revisio-idiomes.json data/music-channel-video-allowlist.json data/feed.json data/archive/channels data/history-pool.json data/historial-musical.json data/albums-musica.json data/music-topic-catalog.json data/music-content-audit.json data/music-feed-audit.json data/search_index_*.json docs/revisions/2026-10-13-supervisio-idioma-resultat.json docs/revisions/2026-10-13-supervisio-idioma-resultat.md compartir sw.js
          git commit -m 'Retira 44 enregistraments sense català com a llengua principal'
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Prepara el lloc estatic
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests _site/scripts _site/functions _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplega el cataleg revisat
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: diagnostic-supervisio-idioma
          path: |
            /tmp/supervisio-tests.log
            /tmp/tardor-blat-quinto-validation.json
            /tmp/tardor-blat-quinto-tests.json
          retention-days: 1
