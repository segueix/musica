name: Aplicar vídeos ocults

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/ocultar_titols_castella.js'

permissions:
  contents: write

concurrency:
  group: aplicar-videos-ocults
  cancel-in-progress: false

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Materialitza les regles al registre d'ocults
        run: node scripts/ocultar_titols_castella.js
      - name: Comprova què ha canviat
        id: changes
        run: |
          if git diff --quiet -- data/hidden-videos.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff -- data/hidden-videos.json
          fi
      - name: Desa els IDs ocults
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/hidden-videos.json
          git commit -m "Materialitza regles de vídeos ocults"
          git push
