name: Publicar previsualitzacions Música

on:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - 'js/**'
      - 'scripts/generar_pagines_compartir.js'
      - '.github/workflows/publicar-comparticio-musica.yml'
  workflow_run:
    workflows: ['Actualitzar feed musical', 'Actualitzar feed només dels grups nous', 'Arxivar feed musical', 'Aplicar vídeos ocults', 'Actualitzar Service Worker Música', "Mantenir cobertura d'afinitats"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publica:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Sincronitza i genera les pàgines
        run: |
          git pull --ff-only origin main
          node scripts/generar_pagines_compartir.js
          node scripts/actualitzar_versio_sw.js
      - name: Desa les pàgines per als desplegaments des de main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add compartir sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'chore: actualitza previsualitzacions musicals'
            git push origin HEAD:main
          fi
      - name: Prepara el lloc estàtic
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests _site/scripts _site/functions _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
