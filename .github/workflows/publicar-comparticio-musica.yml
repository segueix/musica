name: Publicar web estàtica Música

on:
  push:
    branches: [main]
    # Només fitxers del sistema; un canvi de catàleg no inicia un desplegament.
    paths:
      - '*.html'
      - 'css/**'
      - 'js/**/*.js'
      - '!js/features/music-affinity-catalog.js'
      - 'sw.js'
      - 'manifest.json'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - 'icons/**'
      - 'fonts/**'
      - 'robots.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/optimitzar_web_estatica.cjs'
      - 'scripts/generar_web_estatica.cjs'
      - 'scripts/validar_paquet_estatic.cjs'
      - 'scripts/comprovar_publicacio_estatica.cjs'
      - 'scripts/decidir_publicacio_estatica.cjs'
      - 'scripts/lib/cataleg_public.js'
      - 'scripts/lib/filtre_videos_canal.js'
      - 'scripts/generar_pagines_compartir.js'
      - 'scripts/actualitzar_versio_sw.js'
      - '.github/workflows/publicar-comparticio-musica.yml'
  workflow_run:
    branches: [main]
    # Una sola publicació després del torn diari o d'una actualització MANUAL demanada.
    workflows: ['Actualitzar feed musical', 'Actualitzar feed només dels grups nous', 'Manteniment musical manual', "Llista d'èxits setmanal"]
    types: [completed]
  workflow_dispatch:

concurrency:
  # El publicador només llegeix main: no pot substituir el torn diari pendent.
  # Conserva una publicació en curs i agrupa les pendents en la més recent.
  group: music-pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publica:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - name: Exigeix un únic origen de publicació
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type="$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.build_type')"
          if [ "$build_type" != workflow ]; then
            echo '::error::Pages publica des d’una branca i pot sobreescriure el paquet optimitzat. Canvia Settings → Pages → Build and deployment → Source a GitHub Actions.'
            exit 1
          fi
      - name: Obté la URL pública de Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Evita reconstruir una publicació repetida
        id: scope
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          FORCE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' || github.run_attempt > 1 }}
        run: |
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          node scripts/decidir_publicacio_estatica.cjs
      - uses: actions/setup-node@v5
        if: steps.scope.outputs.publish == 'true'
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
        if: steps.scope.outputs.publish == 'true'
      - run: node node_modules/esbuild/install.js
        if: steps.scope.outputs.publish == 'true'
      - name: Genera i valida un únic paquet del checkout
        if: steps.scope.outputs.publish == 'true'
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -n "$SITE_URL"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          npm run build:static
          npm run validate:static
          cat _site/static-build.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        if: steps.scope.outputs.publish == 'true'
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
          retention-days: 1
      - name: Publica a GitHub Pages
        if: steps.scope.outputs.publish == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
      - name: Comprova els fitxers que realment serveix la web
        if: steps.scope.outputs.publish == 'true'
        run: node scripts/comprovar_publicacio_estatica.cjs --out=_site

