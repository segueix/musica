name: Publicar previsualitzacions Música

on:
  push:
    branches: [main]
    # Només fitxers del sistema; un canvi de catàleg no inicia un desplegament.
    paths:
      - '*.html'
      - 'css/**'
      - 'js/**/*.js'
      - '!js/features/music-affinity-catalog.js'
      - 'sw.js'
      - 'manifest.json'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - 'icons/**'
      - 'fonts/**'
      - 'robots.txt'
      - 'scripts/generar_pagines_compartir.js'
      - 'scripts/actualitzar_versio_sw.js'
      - '.github/workflows/publicar-comparticio-musica.yml'
  workflow_run:
    branches: [main]
    # Una sola publicació després del torn diari o d'una actualització MANUAL demanada.
    workflows: ['Actualitzar feed musical', 'Actualitzar feed només dels grups nous', 'Actualitzador feed musical (manual)', 'Manteniment musical manual']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  publica:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Genera pàgines i versió del Service Worker en la mateixa feina
        run: |
          git pull --ff-only origin main
          node scripts/generar_pagines_compartir.js
          node scripts/actualitzar_versio_sw.js
          bash scripts/publicar_dades.sh "chore: actualitza previsualitzacions musicals" compartir sw.js
      - name: Prepara el lloc estàtic
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/.agents _site/tests _site/scripts _site/functions _site/docs
          rm -f _site/AGENTS.md _site/CLAUDE.md
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
