name: Publicar web estàtica Música

on:
  push:
    branches: [main]
    # Només fitxers del sistema; un canvi de catàleg no inicia un desplegament.
    paths:
      - '*.html'
      - 'css/**'
      - 'js/**/*.js'
      - '!js/features/music-affinity-catalog.js'
      - 'sw.js'
      - 'manifest.json'
      - 'assets/**'
      - 'images/**'
      - 'img/**'
      - 'icons/**'
      - 'fonts/**'
      - 'robots.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'scripts/optimitzar_web_estatica.cjs'
      - 'scripts/generar_web_estatica.cjs'
      - 'scripts/validar_paquet_estatic.cjs'
      - 'scripts/lib/filtre_videos_canal.js'
      - 'scripts/generar_pagines_compartir.js'
      - 'scripts/actualitzar_versio_sw.js'
      - '.github/workflows/publicar-comparticio-musica.yml'
  workflow_run:
    branches: [main]
    # Una sola publicació després del torn diari o d'una actualització MANUAL demanada.
    workflows: ['Actualitzar feed musical', 'Actualitzar feed només dels grups nous', 'Actualitzador feed musical (manual)', 'Manteniment musical manual']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publica:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node node_modules/esbuild/install.js
      - name: Obté la URL pública de Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Genera i valida un únic paquet del checkout
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          test -n "$SITE_URL"
          export SOURCE_COMMIT="$(git rev-parse HEAD)"
          npm run build:static
          npm run validate:static
          cat _site/static-build.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          name: github-pages-${{ github.run_attempt }}
      - name: Publica a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

