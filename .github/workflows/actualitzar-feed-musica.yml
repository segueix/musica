name: Actualitzar feed musical

# Canvis de grups, seleccions i revisions: esperen al torn programat; mai push ni workflow_run.
on:
  schedule:
    # Petició del 14/10: passada diària, només canals amb torn vençut (1/3/7 dies).
    - cron: "0 20 * * *"
      timezone: "Europe/Madrid"
  workflow_dispatch:
    inputs:
      discografia_sencera:
        description: "Força la discografia sencera dels Tema (per defecte, torns de set dies)"
        type: boolean
        default: false

concurrency:
  group: music-data-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actualitza:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - name: Sincronitza main
        run: git pull --ff-only origin main
      - name: Decideix si correspon actualitzar
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          node - <<'NODE'
          const fs = require('node:fs');
          const { decideScope } = require('./scripts/lib/abast_feed.js');
          const scope = decideScope({ event: process.env.EVENT_NAME, schedule: process.env.EVENT_SCHEDULE });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `work=${scope.work}\nrun_api=${scope.runApi}\n`);
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, scope.message + '\n');
          NODE
      - name: Instal·la dependències una sola vegada
        if: steps.scope.outputs.work == 'true'
        run: npm ci
      - name: "Validar base musical"
        if: steps.scope.outputs.work == 'true'
        run: npm run music:validate
      - name: Prova el pipeline abans de consultar YouTube
        if: steps.scope.outputs.work == 'true'
        run: |
          node scripts/test_music_content_classifier.js
          node --test scripts/test_workflow_quota.cjs scripts/test_activitat_musica.cjs
          npx vitest run tests/cataleg-musical.test.js tests/any-original.test.js tests/music-content-overrides.test.js tests/channel-video-allowlist.test.js tests/canals-revisats.test.js tests/subtitols-castella.test.js tests/aprimar-feed.test.js tests/canal-tema.test.js tests/revisio-idiomes.test.js tests/quota-feed.test.js tests/llancaments-musicals.test.js
      - name: Treu les baixes sense API
        if: steps.scope.outputs.work == 'true'
        run: node scripts/purgar_canals_feed.js
      - name: Genera feed
        if: steps.scope.outputs.run_api == 'true'
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: "50"
          MUSIC_TOPIC_GOVERNANCE: "apply"
          MUSIC_TOPIC_FULL_DAYS: "7"
          MUSIC_TOPIC_FULL_READ: ${{ inputs.discografia_sencera && '1' || '0' }}
        run: node scripts/update_music_feed.js
      # El generador ja aprima el feed. Arxiu i afinitats es fan aquí, no en workflows encadenats.
      - name: Arxiva i actualitza les afinitats
        if: steps.scope.outputs.work == 'true'
        run: |
          node scripts/archivar_feed_musical.js
          node scripts/generar_afinitats_musica.js --repair-catalog
      - name: Regenera la cerca i comprova la cobertura
        if: steps.scope.outputs.work == 'true'
        run: |
          npm run search:index:hybrid:rebuild
          node - <<'NODE'
          const a = require('./data/music-feed-audit.json');
          if (!a.feedChannelCount) throw new Error('El feed no conté cap canal');
          console.log(`Cobertura: ${a.feedChannelCount}/${a.indexedChannelCount}`);
          NODE
      - name: Publica totes les dades en un sol commit
        if: steps.scope.outputs.work == 'true'
        run: >-
          bash scripts/publicar_dades.sh "data: actualització musical programada" data js/channels-ca.json js/features/music-affinity-catalog.js
