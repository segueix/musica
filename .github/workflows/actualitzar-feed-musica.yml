name: Actualitzar feed musical

on:
  workflow_run:
    workflows:
      - "Validar base musical"
    types:
      - completed
  push:
    branches:
      - main
    paths:
      - "scripts/update_music_feed.js"
      - "scripts/generar_index_cerca.js"
      - "data/music-exclusions.json"
      - "data/noms-canals.json"
      - "data/music-content-overrides.json"
      - "data/music-channel-video-allowlist.json"
      - "data/falsos-shorts.json"
      - "data/hidden-videos.json"
      - "data/musica-dates.json"
      - "data/musica-classica.json"
      - "scripts/lib/classificar_contingut_musical.js"
      - "scripts/lib/revisio_manual_musical.js"
      - "scripts/lib/any_original_musical.js"
      - "scripts/lib/cataleg_musical.js"
      - "scripts/test_music_content_classifier.js"
      - ".github/workflows/actualitzar-feed-musica.yml"
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  actualitza:
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event == 'push' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sincronitza main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Instal·la dependències
        run: npm ci

      - name: Valida la base d'artistes
        run: npm run music:validate

      - name: Prova classificador musical
        run: node scripts/test_music_content_classifier.js

      - name: Prova catàleg, any original i revisions manuals
        run: npx vitest run tests/cataleg-musical.test.js tests/any-original.test.js tests/music-content-overrides.test.js tests/channel-video-allowlist.test.js

      - name: Genera feed des de la base musical
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: "50"
        run: node scripts/update_music_feed.js

      - name: Valida cobertura
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('data/music-feed-audit.json','utf8'));
          if(!a.feedChannelCount) throw new Error('El feed no conté cap canal');
          if(a.unresolvedChannelIds.length) {
            console.warn('Canals no resolts:',a.unresolvedChannelIds);
          }
          console.log(`Cobertura: ${a.feedChannelCount}/${a.indexedChannelCount} canals; ${a.feedVideoCount} vídeos`);
          NODE

      - name: Regenera índex de cerca després del feed
        run: npm run search:index:hybrid:rebuild

      - name: Publica feed i índex en un sol commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # El checkout és net i aquests scripts només generen dades derivades.
          # -A és necessari perquè el generador de l'índex pot eliminar fragments orfes.
          git add -A data js/channels-ca.json

          if git diff --cached --quiet; then
            echo "Feed i índex sense canvis."
            exit 0
          fi

          git commit -m "data: actualitza feed i índex musical"
          git push origin HEAD:main
