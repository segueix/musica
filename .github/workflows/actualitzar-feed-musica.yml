name: Actualitzar feed musical

on:
  push:
    paths:
      - "scripts/update_music_feed.js"
      - "scripts/lib/classificar_contingut_musical.js"
      - "scripts/test_music_content_classifier.js"
      - ".github/workflows/actualitzar-feed-musica.yml"
  schedule:
    - cron: "37 8 * * *"
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

jobs:
  actualitza:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sincronitza main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Prova classificador musical
        run: node scripts/test_music_content_classifier.js

      - name: Genera feed des de la base musical
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: "15"
        run: node scripts/update_music_feed.js

      - name: Valida cobertura
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('data/music-feed-audit.json','utf8'));
          if(!a.feedChannelCount) throw new Error('El feed no conté cap canal');
          if(a.unresolvedChannelIds.length) {
            console.warn('Canals no resolts:',a.unresolvedChannelIds);
          }
          console.log(`Cobertura: ${a.feedChannelCount}/${a.indexedChannelCount} canals; ${a.feedVideoCount} vídeos`);
          NODE

      - name: Publica feed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/feed.json js/channels-ca.json data/music-feed-audit.json data/music-content-audit.json data/music-content-review.json
          if git diff --cached --quiet; then
            echo "Feed sense canvis."
            exit 0
          fi
          git commit -m "data: actualitza feed musical"
          git push origin HEAD:main
