name: Revisió automàtica d'idiomes (informe)

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Vídeos a examinar (1–100). Mai aplica canvis al catàleg."
        type: string
        default: "100"
  schedule:
    - cron: "23 3 * * *"
  push:
    branches: [main, codex/idiomes-auto-20261014]
    paths:
      - .github/workflows/revisar-idiomes-automatic.yml
      - scripts/revisar_idiomes_automatic.js
      - scripts/lib/revisio_automatica.js
      - scripts/test_revisio_automatica.cjs

permissions:
  contents: read

concurrency:
  group: idiomes-auto-${{ github.ref }}
  cancel-in-progress: false

jobs:
  informe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Proves de seguretat i de no modificació del catàleg
        run: node --test scripts/test_revisio_automatica.cjs
      - name: Recupera només el progrés (sense lletres)
        uses: actions/cache/restore@v4
        with:
          path: .cache/idiomes-auto/checkpoint.json
          key: idiomes-auto-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            idiomes-auto-v1-${{ github.ref_name }}-
      - name: Examina el lot i genera l'informe
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          IDIOMES_AUTO_MODEL: ${{ vars.IDIOMES_AUTO_MODEL || 'gpt-4.1-mini' }}
          IDIOMES_AUTO_MAX_AI: "25"
          IDIOMES_AUTO_MAX_SEARCH: "10"
          IDIOMES_AUTO_WEB_SEARCH: ${{ vars.IDIOMES_AUTO_WEB_SEARCH || '1' }}
          REVIEW_LIMIT: ${{ inputs.limit || '100' }}
        run: node scripts/revisar_idiomes_automatic.js --limit="$REVIEW_LIMIT"
      - name: Confirma que les dades publicades no han canviat
        run: git diff --exit-code -- data/ js/ sw.js
      - name: Desa el progrés, també si una consulta s'ha interromput
        if: always() && hashFiles('.cache/idiomes-auto/checkpoint.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .cache/idiomes-auto/checkpoint.json
          key: idiomes-auto-v1-${{ github.ref_name }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Desa l'informe (sense lletres completes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revisio-idiomes-${{ github.run_id }}
          path: reports/idiomes-auto/
          retention-days: 30
          if-no-files-found: warn

  qualitat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
