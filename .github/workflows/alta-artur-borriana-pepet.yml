name: Alta Artur Borriana Pepet
on:
  push:
    branches: [main]
    paths: ['.github/workflows/alta-artur-borriana-pepet.yml']
  workflow_dispatch:
concurrency:
  group: music-data-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Consulta acotada de canals i enregistraments
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: node scripts/revisions/descobrir_artur_borriana_pepet.js
      - name: Desa la consulta per a la revisió editorial
        run: |
          bash scripts/publicar_dades.sh "docs: consulta dels canals d’Artur Àlvarez, Borriana Big Band i Pepet i Marieta" docs/revisions/2026-10-13-artur-borriana-pepet-*
      - uses: actions/upload-artifact@v4
        with:
          name: metadades-artur-borriana-pepet
          path: docs/revisions/2026-10-13-artur-borriana-pepet-*
          retention-days: 1
