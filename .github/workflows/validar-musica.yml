name: Validar base musical

on:
  pull_request:
    branches: [main]
    # Només canvis del sistema. Dades editorials i scripts d'altes puntuals no gasten Actions.
    paths:
      - 'js/**/*.js'
      - '!js/features/music-affinity-catalog.js'
      - 'scripts/*.js'
      - 'scripts/*.cjs'
      - 'scripts/*.sh'
      - 'scripts/lib/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'data/artistes-musica.schema.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  valida:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Proves sense xarxa de quota i revisió Codex
        run: node --test scripts/test_workflow_quota.cjs scripts/test_revisio_codex.cjs
      - name: Comprova la sintaxi dels generadors
        run: |
          node --check scripts/update_music_feed.js
          node --check scripts/archivar_feed_musical.js
          node --check scripts/update_music_history_views.js
          node --check scripts/lib/subtitols_castella.js
      - name: Proves musicals en una sola invocació
        run: npx vitest run tests/musicbrainz-enrichment.test.js tests/youtube-search-candidates.test.js tests/music-genres.test.js tests/arxiu-musical.test.js tests/music-content-overrides.test.js tests/subtitols-castella.test.js tests/albums-musica.test.js tests/quota-feed.test.js tests/channel-video-allowlist.test.js tests/resoldre-canals-quota.test.js tests/music-affinities-catalog.test.js tests/music-subcategories.test.js
      - name: Valida la base actual
        run: node scripts/validar_artistes_musica.js
