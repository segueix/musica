name: Validar base musical

on:
  push:
    paths:
      - "data/artistes-musica.json"
      - "data/artistes-musica.schema.json"
      - "scripts/validar_artistes_musica.js"
      - "scripts/enriquir_artistes_musicbrainz.js"
      - "tests/musicbrainz-enrichment.test.js"
      - ".github/workflows/validar-musica.yml"
  pull_request:
    paths:
      - "data/artistes-musica.json"
      - "data/artistes-musica.schema.json"
      - "scripts/validar_artistes_musica.js"
      - "scripts/enriquir_artistes_musicbrainz.js"
      - "tests/musicbrainz-enrichment.test.js"
      - ".github/workflows/validar-musica.yml"
  workflow_dispatch:

jobs:
  valida:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Instal·la dependències
        run: npm ci

      - name: Test parser MusicBrainz
        run: npx vitest run tests/musicbrainz-enrichment.test.js

      - name: Valida la base d'artistes
        run: node scripts/validar_artistes_musica.js
