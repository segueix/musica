name: Validar base musical

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    # Només canvis del sistema. Dades editorials i scripts d'altes puntuals no gasten Actions.
    paths:
      - '*.html'
      - 'css/**'
      - 'sw.js'
      - 'manifest.json'
      - 'img/**'
      - 'js/**/*.js'
      - '!js/features/music-affinity-catalog.js'
      - 'scripts/*.js'
      - 'scripts/*.cjs'
      - 'scripts/*.sh'
      - 'scripts/lib/**'
      - 'tests/**'
      - '.github/workflows/**'
      - 'data/artistes-musica.schema.json'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: music-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  valida:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prova classificador musical
        run: node scripts/test_music_content_classifier.js
      - name: Proves sense xarxa de quota i revisió Codex
        run: node --test scripts/test_avisos_idiomes.cjs scripts/test_workflow_quota.cjs scripts/test_revisio_codex.cjs scripts/test_activitat_musica.cjs scripts/test_publicacio_estatica.cjs scripts/test_abast_publicacio.cjs
      - name: Comprova la sintaxi dels generadors
        run: |
          node --check scripts/optimitzar_web_estatica.cjs
          node --check scripts/generar_web_estatica.cjs
          node --check scripts/validar_paquet_estatic.cjs
          node --check scripts/comprovar_publicacio_estatica.cjs
          node --check sw.js
          node --check scripts/update_music_feed.js
          node --check scripts/archivar_feed_musical.js
          node --check scripts/update_music_history_views.js
          node --check scripts/lib/subtitols_castella.js
      - name: Proves musicals en una sola invocació
        run: npx vitest run tests/musicbrainz-enrichment.test.js tests/youtube-search-candidates.test.js tests/music-genres.test.js tests/arxiu-musical.test.js tests/music-content-overrides.test.js tests/subtitols-castella.test.js tests/albums-musica.test.js tests/quota-feed.test.js tests/channel-video-allowlist.test.js tests/resoldre-canals-quota.test.js tests/music-affinities-catalog.test.js tests/music-subcategories.test.js tests/static-site.test.js tests/static-catalog.test.js tests/static-seo-runtime.test.js tests/static-service-worker.test.js tests/admin-musica.test.js tests/music-admin.test.js tests/config-backup.test.js tests/startup-performance.test.js tests/cataleg-musical.test.js tests/any-original.test.js tests/canals-revisats.test.js tests/aprimar-feed.test.js tests/canal-tema.test.js tests/revisio-idiomes.test.js tests/llancaments-musicals.test.js tests/catalog-policy.test.js
      - name: Valida la base actual
        run: node scripts/validar_artistes_musica.js
