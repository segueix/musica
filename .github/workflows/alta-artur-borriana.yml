name: Alta Artur i Borriana
on:
  push:
    branches: [main]
    paths: ['.github/workflows/alta-artur-borriana.yml']
  workflow_dispatch:
concurrency:
  group: music-data-writer
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  incorporar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Valida el script i conserva el catàleg anterior
        run: |
          npm ci
          cp js/channels-ca.json /tmp/artur-borriana-channels-before.json
          node --check scripts/revisions/incorporar_artur_borriana_20261013.js
          node scripts/revisions/incorporar_artur_borriana_20261013.js --self-test
      - name: Aplica només les dues altes seleccionades
        run: |
          node scripts/revisions/incorporar_artur_borriana_20261013.js
          node scripts/documentar_vigilancia_idiomes.js
          npm run music:validate
          node scripts/test_music_content_classifier.js
      - name: Actualitza exclusivament els cinc canals
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: '50'
          MUSIC_TOPIC_GOVERNANCE: apply
          MUSIC_TOPIC_FULL_READ: '1'
        run: |
          test -n "$MUSIC_TARGET_CHANNELS"
          node scripts/update_music_feed.js
      - name: Regenera arxiu, cerca i pàgines compartides
        run: |
          node scripts/archivar_feed_musical.js
          npm run search:index:hybrid:rebuild
          node scripts/generar_pagines_compartir.js
          node scripts/documentar_vigilancia_idiomes.js
          node scripts/documentar_vigilancia_idiomes.js --check
      - name: Executa totes les proves i no admet regressions
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('scripts/revisions/provar_altes_musicals.js','utf8');
          const old='docs/revisions/2026-10-12-tardor-blat-quinto.json';
          if(!source.includes(old))throw Error('El comprovador ha canviat; cal revisar-lo');
          fs.writeFileSync('scripts/revisions/.provar-artur-borriana.tmp.js',source.replaceAll(old,'docs/revisions/2026-10-13-artur-borriana-alta.json'));
          NODE
          node scripts/revisions/.provar-artur-borriana.tmp.js
      - name: Comprova lint i reprodueix els mateixos errors a HEAD
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const path=require('node:path');
          const assert=require('node:assert/strict');
          const {spawnSync,execFileSync}=require('node:child_process');
          const root=process.cwd(), baseline='/tmp/musica-abans-altes';
          if(!fs.existsSync(baseline))execFileSync('git',['worktree','add','--detach',baseline,'HEAD'],{stdio:'inherit'});
          if(!fs.existsSync(path.join(baseline,'node_modules')))fs.symlinkSync(path.join(root,'node_modules'),path.join(baseline,'node_modules'),'dir');
          const tracked=execFileSync('git',['ls-files','-z','--','js'],{encoding:'utf8'}).split('\0').filter(f=>f.endsWith('.js'));
          assert(tracked.length>0,'No es troben els fitxers del codi de l’aplicació');
          for(const file of tracked)assert(fs.readFileSync(path.join(root,file)).equals(fs.readFileSync(path.join(baseline,file))),'S’ha modificat codi aliè a les altes: '+file);
          function lint(cwd){
            const r=spawnSync(process.execPath,[path.join(root,'node_modules/eslint/bin/eslint.js'),'js/**/*.js','-f','json'],{cwd,encoding:'utf8',maxBuffer:20*1024*1024});
            if(r.error)throw r.error;
            assert([0,1].includes(r.status),'Error de configuració o execució de lint: '+r.stderr);
            const rows=JSON.parse(r.stdout);
            assert(Array.isArray(rows)&&rows.length>0,'Lint no ha inspeccionat el codi');
            return {status:r.status,errors:rows.reduce((n,r)=>n+r.errorCount,0),warnings:rows.reduce((n,r)=>n+r.warningCount,0),
              diagnostics:rows.filter(r=>r.messages.length).map(r=>({file:path.relative(cwd,r.filePath),messages:r.messages})).sort((a,b)=>a.file.localeCompare(b.file))};
          }
          const current=lint(root), previous=lint(baseline);
          fs.writeFileSync('/tmp/artur-borriana-lint.json',JSON.stringify({current,previous},null,2)+'\n');
          assert.equal(current.status,previous.status,'Ha canviat el resultat de lint');
          assert.deepEqual(current.diagnostics,previous.diagnostics,'Hi ha errors o avisos de lint nous');
          const result={errors:current.errors,warnings:current.warnings,baselineCompared:true,identicalDiagnostics:true,unchangedApplicationFiles:tracked.length,regressions:0};
          const file='/tmp/tardor-blat-quinto-validation.json';
          const validation=JSON.parse(fs.readFileSync(file,'utf8'));validation.lint=result;
          fs.writeFileSync(file,JSON.stringify(validation,null,2)+'\n');
          console.log(JSON.stringify(result));
          NODE
      - name: Verifica el resultat publicable
        run: |
          node scripts/revisions/incorporar_artur_borriana_20261013.js --verify
          node scripts/actualitzar_versio_sw.js
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('/tmp/tardor-blat-quinto-validation.json','utf8')).lint;
          fs.appendFileSync('docs/revisions/2026-10-13-artur-borriana-alta.md','\nControl de codi: '+r.errors+' errors i '+r.warnings+' avisos de lint reproduïts idènticament sobre HEAD anterior; cap canvi en els '+r.unchangedApplicationFiles+' fitxers JavaScript de l’aplicació i cap diagnòstic nou.\n');
          NODE
          cat docs/revisions/2026-10-13-artur-borriana-alta.md >> "$GITHUB_STEP_SUMMARY"
      - name: Publica les dades juntes sense sobreescriure canvis simultanis
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data js/channels-ca.json docs/revisions/2026-10-13-artur-borriana-alta.json docs/revisions/2026-10-13-artur-borriana-alta.md docs/ARTISTES_VIGILATS_IDIOMA.md compartir sw.js
          if ! git diff --cached --quiet; then
            git commit -m 'data: incorpora Artur Àlvarez i Borriana Big Band'
            git push origin HEAD:main
          fi
      - name: Prepara el lloc estàtic actualitzat
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests _site/scripts _site/functions _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplega el catàleg actualitzat
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Conserva el diagnòstic si falla alguna comprovació
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-artur-borriana
          retention-days: 1
          path: |
            /tmp/tardor-blat-quinto-tests.json
            /tmp/tardor-blat-quinto-baseline-tests.json
            /tmp/tardor-blat-quinto-validation.json
            /tmp/artur-borriana-lint.json
            docs/revisions/2026-10-13-artur-borriana-alta.json
