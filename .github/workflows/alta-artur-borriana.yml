name: Alta Artur i Borriana
on:
  push:
    branches: [main]
    paths: ['.github/workflows/alta-artur-borriana.yml']
  workflow_dispatch:
concurrency:
  group: music-data-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  resum:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - name: Resumeix les dades ja consultades
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const j=JSON.parse(fs.readFileSync('docs/revisions/2026-10-13-artur-borriana-descoberta.json','utf8'));
          const out=[];
          for(const a of j.artists){
            out.push('# '+a.name,JSON.stringify({existing:a.existing}));
            for(const c of a.channels){
              const albums={};
              for(const v of c.videos){
                const d=v.description.split(/[\r\n]+/).map(s=>s.trim()).filter(Boolean);
                const album=/^Provided to YouTube/i.test(d[0]||'')?d[2]:'[canal oficial]';
                albums[album]=(albums[album]||0)+1;
              }
              out.push('## '+c.id+' | '+c.name+' | '+c.handle+' | complet='+c.complete+' | vídeos='+c.videos.length,JSON.stringify({albums}));
              for(const v of c.videos){
                const d=v.description.split(/[\r\n]+/).map(s=>s.trim()).filter(Boolean);
                const album=/^Provided to YouTube/i.test(d[0]||'')?d[2]:'';
                out.push([v.id,v.title,v.duration,album].join(' | ').replace(/[\r\n]+/g,' '));
              }
            }
          }
          out.push('# Orígens',JSON.stringify({places:j.originPlaces,artists:j.existingOrigins}));
          fs.writeFileSync('docs/revisions/2026-10-13-artur-borriana-compacte.md',out.join('\n')+'\n');
          NODE
      - name: Desa el resum
        run: |
          bash scripts/publicar_dades.sh "docs: discografia compacta d’Artur Àlvarez i Borriana Big Band" docs/revisions/2026-10-13-artur-borriana-compacte.md
