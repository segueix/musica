name: Descobrir artistes de música

on:
  push:
    paths:
      - "scripts/descobrir_artistes_musica.js"
      - ".github/workflows/descobrir-musica.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: descobrir-musica
  cancel-in-progress: true

jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "20"

      - name: Sincronitza amb l'últim main
        run: |
          git fetch origin main
          git reset --hard origin/main

      - name: Descobreix candidats
        run: node scripts/descobrir_artistes_musica.js

      - name: Valida la base
        run: node scripts/validar_artistes_musica.js

      - name: Publica canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/artistes-musica.json

          if git diff --cached --quiet; then
            echo "Sense artistes nous."
            exit 0
          fi

          git commit -m "data: actualitza candidats musicals"
          git push origin HEAD:main
