name: Descobrir artistes de música

# Manteniment programat o execució manual explícita. Cap push ni encadenament.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  descobrir:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Sincronitza main
        run: git pull --ff-only origin main
      - name: Descobreix candidats i dades de MusicBrainz
        run: |
          node scripts/descobrir_artistes_musica.js
          node scripts/enriquir_artistes_musicbrainz.js
      - name: Resol canals coneguts
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: node scripts/resoldre_canals_youtube.js
      - name: Valida gèneres i afinitats
        run: |
          node scripts/enriquir_generes_musica.js
          node scripts/validar_artistes_musica.js
          node scripts/generar_afinitats_musica.js --repair-catalog
      - name: Desa les dades; el feed espera al torn diari
        run: >-
          bash scripts/publicar_dades.sh "data: actualitza candidats musicals" data js/channels-ca.json js/features/music-affinity-catalog.js
