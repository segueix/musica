name: Inspeccionar candidats musicals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-candidats-musicals.yml"]
permissions:
  contents: read
jobs:
  inspeccio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Consulta limitada de candidats i repertoris
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: |
          node - <<'NODE'
          async function api(endpoint, params) {
            const url = new URL('https://www.googleapis.com/youtube/v3/' + endpoint);
            for (const [k,v] of Object.entries(params)) url.searchParams.set(k,v);
            url.searchParams.set('key', process.env.YOUTUBE_API_KEY_SERVER);
            const res = await fetch(url);
            const data = await res.json();
            if (!res.ok) throw new Error('YouTube HTTP ' + res.status + ': ' + (data.error?.errors?.[0]?.reason || 'error'));
            return data;
          }
          (async()=>{
           const vids=new Set(["5Ib4h3aC2RE","6LcjbBbOt_U","D5A6T_eVyrM","HQwYp5iErqo","IxN-4GIqya4","OLSv6Z7amR0","RA4zzpz69KM","RwIKVpFFznM","Yr83BJXoFaM","ZIHtCvDCWTM","hXfE-BZCtJo","o0ZlXHr_yRc","sFeEqeoEtOM","v3K0tHmYzPw","uyQhl6D75sg","UHWg6k6GdT8","sqV58mvnPWM","SVnGLKqGpj4","Ltxrh7OFZw4","psn6OYGk9M8","x0600QG5yVo","7abqbEGdCFM","rGKGnWOL5J4","FeotQ8SOxq4","QrsTQkoYx7k","s7LFhoPGb58","hymQyy-ZCss","AH5TKPmRdQ8","DuG56JoHl2E","2I0ZxBIdZLQ","Z4irLitnQRk","kS-ByZ1PsdI","DDE-RYIqCHw","OKF6zVKedag","oxadvkrxuq0","PFPcb0S0d0c","ScmkirS0eW8","jc2w-CAzJFw"]), channelIds=new Set();
           for(const q of ['"Bestiari" "Nit d\'estrena"','"Bestiari" "Persona tèbia"','"Ciment" "Pau Casas"','"Ciment" "Histeria"']){
            const r=await api('search',{part:'snippet',type:'video',maxResults:'5',q});
            console.log('SEARCH '+JSON.stringify({q,items:r.items}));
            for(const x of r.items||[]){if(x.id?.videoId)vids.add(x.id.videoId);if(/^(Bestiari|Ciment)/i.test(x.snippet?.channelTitle||''))channelIds.add(x.snippet.channelId);}
           }
           for(const q of ['"Bestiari"','"Ciment" "Topic"']){
            const r=await api('search',{part:'snippet',type:'channel',maxResults:'5',q});
            console.log('SEARCH '+JSON.stringify({q,items:r.items}));
            for(const x of r.items||[])if(/^(Bestiari|Ciment)/i.test(x.snippet?.title||''))channelIds.add(x.id.channelId);
           }
           for(const id of channelIds){
            try{
             const c=(await api('channels',{part:'snippet,contentDetails',id})).items?.[0];if(!c)continue;
             const playlistId=c.contentDetails?.relatedPlaylists?.uploads;
             const p=await api('playlistItems',{part:'snippet,contentDetails',playlistId,maxResults:'50'});
             const tracks=(p.items||[]).map(x=>({id:x.contentDetails.videoId,title:x.snippet.title,description:x.snippet.description}));
             tracks.forEach(t=>vids.add(t.id));
             console.log('REPERTOIRE '+JSON.stringify({id,title:c.snippet.title,handle:c.snippet.customUrl,description:c.snippet.description,tracks,more:!!p.nextPageToken}));
            }catch(e){console.log('CHANNEL_ERROR '+JSON.stringify({id,error:e.message}));}
           }
           const ids=[...vids];
           for(let i=0;i<ids.length;i+=50){
            const data=await api('videos',{part:'snippet,contentDetails',id:ids.slice(i,i+50).join(',')});
            for(const v of data.items||[]){
             const m=v.contentDetails.duration.match(/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/);
             const seconds=m?Number(m[1]||0)*3600+Number(m[2]||0)*60+Number(m[3]||0):0;
             let redirect={};
             if(seconds>0&&seconds<=120){
              try{const r=await fetch('https://www.youtube.com/shorts/'+v.id,{method:'HEAD',redirect:'manual',signal:AbortSignal.timeout(10000)});redirect={status:r.status,location:r.headers.get('location')};}catch{redirect={error:'network'};}
             }
             console.log('VIDEO '+JSON.stringify({id:v.id,title:v.snippet.title,channelId:v.snippet.channelId,channelTitle:v.snippet.channelTitle,description:v.snippet.description,seconds,...redirect}));
            }
           }
          })().catch(e=>{console.error(e.message);process.exit(1)});
          NODE
