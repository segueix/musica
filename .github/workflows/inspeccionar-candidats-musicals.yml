name: Verificar resultat grup 2
on:
  workflow_run:
    workflows: ["Actualitzar feed musical"]
    types: [completed]
permissions:
  contents: read
jobs:
  verifica:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Comprova seleccio i exclusions
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const specs=[{"artist":"Baixa Fidelitat","id":"UCk0dxKPgahJyFPV_F1VWVuA","type":"topic","ids":["5Ib4h3aC2RE","6LcjbBbOt_U","D5A6T_eVyrM","HQwYp5iErqo","IxN-4GIqya4","OLSv6Z7amR0","RA4zzpz69KM","RwIKVpFFznM","Yr83BJXoFaM","ZIHtCvDCWTM","hXfE-BZCtJo","o0ZlXHr_yRc","sFeEqeoEtOM"]},{"artist":"Bestiari","id":"UCf0MYgzgqhRYuimo71a2dYQ","type":"official","ids":["0ZfkvQlg2yI","hIyZqDaZLSU"]},{"artist":"Brot Bord","id":"UCc2hL_Q_Fi_nKHLptRFnw3w","type":"topic","ids":["UHWg6k6GdT8","sqV58mvnPWM","SVnGLKqGpj4","Ltxrh7OFZw4","psn6OYGk9M8"]},{"artist":"Brot Bord","id":"UCghKNKEskCkE55Wl5A-ggiQ","type":"topic","ids":["7abqbEGdCFM","rGKGnWOL5J4","FeotQ8SOxq4","QrsTQkoYx7k","s7LFhoPGb58","hymQyy-ZCss","AH5TKPmRdQ8","DuG56JoHl2E","2I0ZxBIdZLQ","Z4irLitnQRk","kS-ByZ1PsdI","DDE-RYIqCHw","OKF6zVKedag","oxadvkrxuq0"]},{"artist":"The Cabrians","id":"UC-N1gUYe6UmwHOSQAUPH2-A","type":"other","ids":["PFPcb0S0d0c"]}];
          const feed=JSON.parse(fs.readFileSync('data/feed.json','utf8'));
          const found=new Map();
          function walk(o){ if(!o||typeof o!=='object') return; if(typeof o.id==='string'&&specs.some(s=>s.ids.includes(o.id)||s.id===o.channelId)) found.set(o.id,o); for(const v of Object.values(o))if(v&&typeof v==='object')walk(v); }
          walk(feed);
          function files(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=dir+'/'+e.name;if(e.isDirectory())files(p);else if(p.endsWith('.json'))walk(JSON.parse(fs.readFileSync(p,'utf8')));}}
          files('data/archive');
          const allAllowed=new Set(specs.flatMap(s=>s.ids));
          for(const s of specs){const missing=s.ids.filter(id=>!found.has(id)); console.log(JSON.stringify({artist:s.artist,channel:s.id,expected:s.ids.length,missing}));assert.equal(missing.length,0,'Vídeos absents');}
          for(const [id,v]of found)if(specs.some(s=>s.id===v.channelId))assert(allAllowed.has(id),'Vídeo no autoritzat '+id);
          const a=JSON.parse(fs.readFileSync('data/artistes-musica.json','utf8'));assert.equal(a.artists.find(a=>a.name==='Ciment').active,false);
          console.log('GRUP_2_OK '+allAllowed.size+' vídeos; Ciment pendent; selecció exacta.');
          NODE
