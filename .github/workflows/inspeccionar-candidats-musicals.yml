name: Verificar resultat grup 1
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-candidats-musicals.yml"]
permissions:
  contents: read
jobs:
  verifica:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Verifica cobertura i exclusions del grup 1
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const read=p=>JSON.parse(fs.readFileSync(p,'utf8'));
          const feed=read('data/feed.json'), channels=[["Assot","UCgAPpOaGsoDsXdEQKLB6gnQ","topic",null,"Assot - Topic"],["ASSAC!","UCzyjfdkAmiRCOjJGuUVbqYg","other",null,"cerinobalzano"],["Autodestrucció","UC8yBjieIRVNRxjAVi0FO1DQ","topic",null,"Autodestrucció - Topic"],["All Crü","UCyNWjZ1IhLo8Iy6nUMEz0rw","official","@allcrupunkrock","ALL CRÜ"],["All Crü","UC_tsO4hz22Lk0jb1CEIFPmw","topic",null,"All Crü - Topic"],["Bonestorm","UCJXKRxaUXEg0kpgb-Kd8uDg","official","@bonestorm2417","Bonestorm"],["Bonestorm","UCGPjtE1NFB1I8oDJ_Mx3O_Q","topic",null,"Bonestorm - Topic"]];
          const rows=[];
          const all=[];
          for(const [artist,id] of channels){
           const archive='data/archive/channels/'+id+'.json';
           const videos=[...(feed.videos||[]).filter(v=>v.channelId===id),...(fs.existsSync(archive)?read(archive).videos:[])];
           const unique=[...new Map(videos.map(v=>[v.id,v])).values()];
           all.push(...unique);
           assert(unique.length>0,'Canal buit: '+artist+' '+id);
           rows.push({artist,id,videos:unique.length,shorts:unique.filter(v=>v.isShort).length});
          }
          for(const id of ['Y8Ja4QlsYoQ','uELIJASXPbQ','T71MRM1GCNM'])assert(!all.some(v=>v.id===id),'Pista exclosa publicada: '+id);
          for(const id of ["_k2E1v6ZjPk","2ZFbGIyyL_o","Kpls4oxXXbE","xNlK5bQTSJU","adUxL-PYM58","8S-V2kDuDlY","AJ6ab1pyaMI","JdXvQ6B_ge8","Tgoih0sZJPQ","X2gNkeQiUXo","YrEY3aV8EXI","aDiDtzq_7LQ","j-K-y4WnNYY","fJT6cU4pZXE","4qFEWcuz8uM","AE8KlCmJ0hE","kr7RgGzGz_k","DOwfQsvQk7I","5AnmhNX3akM","R5zccwDM4gQ","NUIbwSxMXsk","RUJ8Ebvvy80","t1RUiKcAf-E","1daXNAkmeSg","Nf9C7HS461k","IfhVb5i2uiM","DzgnUUMveE4","HyMHqC6ixcc","x43TXEArhqw"])assert(all.some(v=>v.id===id&&!v.isShort),'Fals Short no recuperat: '+id);
          const assac=all.filter(v=>v.channelId==='UCzyjfdkAmiRCOjJGuUVbqYg');
          assert.equal(assac.length,3);
          console.log('GROUP1_VERIFIED '+JSON.stringify(rows));
          
          NODE
      - run: npm ci
      - run: npm run lint
