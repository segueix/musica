name: Inspeccionar candidats musicals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-candidats-musicals.yml"]
permissions:
  contents: read
jobs:
  inspeccio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Consulta limitada de candidats i repertoris
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: |
          node - <<'NODE'
          async function api(endpoint, params) {
            const url = new URL('https://www.googleapis.com/youtube/v3/' + endpoint);
            for (const [k,v] of Object.entries(params)) url.searchParams.set(k,v);
            url.searchParams.set('key', process.env.YOUTUBE_API_KEY_SERVER);
            const res = await fetch(url);
            const data = await res.json();
            if (!res.ok) throw new Error('YouTube HTTP ' + res.status + ': ' + (data.error?.errors?.[0]?.reason || 'error'));
            return data;
          }
          (async () => {
            const ids = new Set(['UC8yBjieIRVNRxjAVi0FO1DQ','UC_tsO4hz22Lk0jb1CEIFPmw','UCyNWjZ1IhLo8Iy6nUMEz0rw','UCJXKRxaUXEg0kpgb-Kd8uDg']);
            for (const q of ['"Assot"','"ASSAC!"','"Bonestorm" "Topic"']) {
              const r = await api('search',{part:'snippet',type:'channel',maxResults:'5',q});
              console.log('SEARCH ' + JSON.stringify({q,items:r.items}));
              for (const x of r.items || []) if (x.id?.channelId) ids.add(x.id.channelId);
            }
            for (const id of ids) {
              const c = await api('channels',{part:'snippet,contentDetails',id});
              const channel = c.items?.[0];
              if (!channel) continue;
              const playlistId = channel.contentDetails?.relatedPlaylists?.uploads;
              const tracks=[];
              let pageToken='';
              for (let page=0; playlistId && page<2; page++) {
                const r = await api('playlistItems',{part:'snippet,contentDetails',playlistId,maxResults:'50',...(pageToken?{pageToken}:{})});
                tracks.push(...(r.items||[]).map(x=>({id:x.contentDetails?.videoId,title:x.snippet?.title,description:x.snippet?.description})));
                pageToken=r.nextPageToken;
                if (!pageToken) break;
              }
              console.log('REPERTOIRE ' + JSON.stringify({id,title:channel.snippet.title,description:channel.snippet.description,tracks,more:!!pageToken}));
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
