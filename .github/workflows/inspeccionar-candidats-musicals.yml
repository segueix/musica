name: Inspeccionar candidats musicals
on:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-candidats-musicals.yml"]
permissions:
  contents: read
jobs:
  inspeccio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Comprova lint existent
        continue-on-error: true
        run: |
          npm ci
          npm run lint
