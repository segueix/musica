name: Inspeccionar candidats musicals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-candidats-musicals.yml"]
permissions:
  contents: read
jobs:
  inspeccio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Consulta limitada de candidats i repertoris
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: |
          node - <<'NODE'
          async function api(endpoint, params) {
            const url = new URL('https://www.googleapis.com/youtube/v3/' + endpoint);
            for (const [k,v] of Object.entries(params)) url.searchParams.set(k,v);
            url.searchParams.set('key', process.env.YOUTUBE_API_KEY_SERVER);
            const res = await fetch(url);
            const data = await res.json();
            if (!res.ok) throw new Error('YouTube HTTP ' + res.status + ': ' + (data.error?.errors?.[0]?.reason || 'error'));
            return data;
          }
          (async () => {
            const ids=new Set(['UCElR_cmETBNoC7Rs6STl0BA','UCrTJ5_xgCZyb-Rt3dp1eUxg','UCokFPjgxi7i2ONsHr8wHj6g']);
            const u=await api('channels',{part:'snippet,contentDetails',forUsername:'molinilloboss'});for(const c of u.items||[])ids.add(c.id);
            for(const id of ids){
              const r=await api('channels',{part:'snippet,contentDetails',id});const c=r.items?.[0];if(!c)continue;
              let token='',tracks=[];for(let n=0;n<4;n++){
                const p=await api('playlistItems',{part:'contentDetails',playlistId:c.contentDetails.relatedPlaylists.uploads,maxResults:'50',...(token?{pageToken:token}:{})});
                const v=await api('videos',{part:'snippet,contentDetails',id:p.items.map(x=>x.contentDetails.videoId).join(',')});tracks.push(...v.items);token=p.nextPageToken||'';if(!token)break;
              }
              for(const track of tracks){if(['7Wzf3EZ0fG4','slQ8MzfTIuY'].includes(track.id)){const h=await fetch('https://www.youtube.com/shorts/'+track.id,{method:'HEAD',redirect:'manual',signal:AbortSignal.timeout(10000)}).catch(()=>null);track.shortCheck={status:h?.status,location:h?.headers.get('location')};}}
              console.log('REPERTOIRE '+JSON.stringify({id,title:c.snippet.title,handle:c.snippet.customUrl,description:c.snippet.description,tracks,more:!!token}));
            }
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
