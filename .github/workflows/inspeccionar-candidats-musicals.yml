name: Verificar resultat grup 6
on:
  workflow_run:
    workflows: ["Actualitzar feed musical"]
    types: [completed]
permissions:
  contents: read
jobs:
  verifica:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Comprova seleccio i exclusions
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const specs=[{"artist":"Tiger Menja Zebra","id":"UCQMMHfq3-mXuozgrnyx-Gcg","type":"topic","ids":["bdoDKiBEWi4","8NyvQO0ZuS0","xX1X1i-i-7E","6XkfsHC0Mfg","AMEZpINEpq8","E19Vrsgu1cU","GpkTEkzbkpU","XWf0x7IBcnU","xt9FHkeJ8xU"]},{"artist":"Ratpenat","id":"UC0Us9bY-uMslfHcmZSVirRw","type":"topic","ids":["S7cB_F9zhAQ","w74VfHusxmg","5uaRqTbwLy0","7oFGW9JSdrM","g0oLGzzf1OQ","jvRi2vk2LYs","sW18u4laXUI","ZPJB929PhNQ","uZWut7RMV2Q","ga16eQFrYe0"]},{"artist":"Zombi Pujol","id":"UCHdLUidEVvmo-4p1h895hcA","type":"topic","ids":["XTF0K67GRBs","YybWMQQ0R38","UPfZe5eVl3w","951XbIoTMqg","ywpmBRp1ALc","L9U-7y6vBfk","CtG2kAzqva8","0ctKtNnkcBA","0remglts4gc","1IPh1IHTRu8","p-BitwZZQAw","oGixYBBeYAk","h4bWvYsG56U","7ch9spF-kNs","CnIMw0BIals","oP39EU3ZTMw","hDjwN16zTJI","G77A2d1ZjMs","kSVXp78yyNg","QsHik7rnI-E","ChhOQ6-Lo9o","qxGxw6wgTlo","lRYa818n2T8","0e9JKz3ePYg","5pPLM9S2P-g","LAr1hDWxi7s","aYUuqU4gU9o","qO0bbOCUSJs","-IJ6UwgqaLw","hHUA1h4Aoow","2LUZFhMnUFM","azH_BoBiNpM"]},{"artist":"Vàlius","id":"UCc20bll252Rwc71ILMnWVcA","type":"topic","ids":["TAPyhxHum_c","fzr3-1ECyJU","kxQPQ1FZ_Zk","wHcbtvlkFIo","KMT8Z-kqHGQ","XV76jIbppPs","cEqvxpHX5yM","2x048x1mTr0","O1rujubfYxs","QNJc3wQvwCw","Umz_6PFuB18","_lNyWJ_yK7k","ky8I3GyeyNg","ngNz0QjwQKg","rjFlkzRdEYw","7oxnizES3OE","IMKdVWZcdB8","RvkjyA5TOsg","jkB5tvtnEJU","vhf_0HKlIBk","Ivs1UY_Q-U8","9Y7DEW84fak","9pUv4_L1Qmw","AkV6QPdbIao","Gupf36LxEqc","Jh4hpy3l7FQ","KSJW3RWK10k","a2xV7AvZi2w","c5fQcNsQUlk","juTxNej5t2k","osxbPIfQxTc","pL-Gml2pZu8","FdYgAF0DTuw","cU3vtoh5B5U","y0hlTRGyITM","dw4QtRukKa8","WfooKX9eqIQ","yZKH03tulEs","vejkZfFrjIY","Jn5n2H-EQz8","fzAU9NHI_QA","HwAu3N4hVGs"]}];
          const feed=JSON.parse(fs.readFileSync('data/feed.json','utf8'));
          const found=new Map();
          function walk(o){ if(!o||typeof o!=='object') return; if(typeof o.id==='string'&&specs.some(s=>s.ids.includes(o.id)||s.id===o.channelId)) found.set(o.id,o); for(const v of Object.values(o))if(v&&typeof v==='object')walk(v); }
          walk(feed);
          function files(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=dir+'/'+e.name;if(e.isDirectory())files(p);else if(p.endsWith('.json'))walk(JSON.parse(fs.readFileSync(p,'utf8')));}}
          files('data/archive');
          const allAllowed=new Set(specs.flatMap(s=>s.ids));
          for(const s of specs){const missing=s.ids.filter(id=>!found.has(id)); console.log(JSON.stringify({artist:s.artist,channel:s.id,expected:s.ids.length,missing}));assert.equal(missing.length,0,'Vídeos absents');}
          for(const [id,v]of found)if(specs.some(s=>s.id===v.channelId))assert(allAllowed.has(id),'Vídeo no autoritzat '+id);
          const a=JSON.parse(fs.readFileSync('data/artistes-musica.json','utf8'));assert.equal(a.artists.find(a=>a.name==='Perro Pachingo').active,false);
          console.log('GRUP_6_OK '+allAllowed.size+' vídeos; Perro Pachingo pendent; selecció exacta.');
          NODE
