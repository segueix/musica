name: Verificar seleccio punk
on:
  workflow_run:
    workflows: ["Actualitzar feed musical"]
    types: [completed]
permissions:
  contents: read
jobs:
  verifica:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Comprova seleccio i exclusions
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');const specs=[{"name":"Frontpilsen","id":"UCOxRObgDa7GRNF7UaO7B83w","ids":["AVme-aAxVyQ","HT5PnRXeh0A"]},{"name":"L'Odi Social","id":"UCkS1qH6mVR8T0hqyHJs0jnA","ids":["nvqawc3_Rvo","unSOr6YqFnQ","1hvCR99PFk0","DiE1FKU2IvQ"]}];const found=new Map();function walk(o){if(!o||typeof o!=='object')return;if(typeof o.id==='string'&&specs.some(s=>s.ids.includes(o.id)||s.id===o.channelId))found.set(o.id,o);for(const v of Object.values(o))if(v&&typeof v==='object')walk(v);}walk(JSON.parse(fs.readFileSync('data/feed.json','utf8')));function files(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=dir+'/'+e.name;if(e.isDirectory())files(p);else if(p.endsWith('.json'))walk(JSON.parse(fs.readFileSync(p,'utf8')));}}files('data/archive');const allowed=new Set(specs.flatMap(s=>s.ids));for(const s of specs){const missing=s.ids.filter(id=>!found.has(id));console.log(JSON.stringify({artist:s.name,channel:s.id,expected:s.ids.length,missing}));assert.equal(missing.length,0,'Vídeos absents');}for(const[id,v]of found)if(specs.some(s=>s.id===v.channelId)){assert(allowed.has(id),'Vídeo no autoritzat '+id);assert(!v.isShort,'Short '+id);}console.log('PUNK_OK '+allowed.size+' vídeos; selecció exacta.');
          NODE
