name: Inspeccionar candidats musicals
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/inspeccionar-candidats-musicals.yml"]
permissions:
  contents: read
jobs:
  inspeccio:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Consulta limitada de candidats i repertoris
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: |
          node - <<'NODE'
          async function api(endpoint, params) {
            const url = new URL('https://www.googleapis.com/youtube/v3/' + endpoint);
            for (const [k,v] of Object.entries(params)) url.searchParams.set(k,v);
            url.searchParams.set('key', process.env.YOUTUBE_API_KEY_SERVER);
            const res = await fetch(url);
            const data = await res.json();
            if (!res.ok) throw new Error('YouTube HTTP ' + res.status + ': ' + (data.error?.errors?.[0]?.reason || 'error'));
            return data;
          }
          (async () => {
            for(const q of ['"Perro Pachingo" "Remenant"','"Perro Pachingo" "Ara"','"Perro Pachingo" Topic']) {const r=await api('search',{part:'snippet',type:'video',maxResults:'5',q});console.log('SEARCH '+JSON.stringify({q,items:r.items}));}
            const r=await api('videos',{part:'snippet,contentDetails',id:'BvZaP9_BiWI,5ZI73Hg3G_E'});console.log('VIDEOS '+JSON.stringify(r.items));
          })().catch(e=>{console.error(e.message);process.exitCode=1;});
          NODE
