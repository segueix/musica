name: Verificar metall grup 1
on:
  workflow_run:
    workflows: ["Actualitzar feed musical"]
    types: [completed]
permissions:
  contents: read
jobs:
  verifica:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Comprova seleccio i exclusions
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const specs=[{"artist":"Vidres a la Sang","id":"UCWWnWo4E1RqWDOX4-y1jwfQ","ids":["WuiYrGgyqjE","xl1WTUcrgB0","ztl6Ku5JPTU","sLUSaDHMWkE","JL9OlQeOwNU","3fjNbykM-e8","G8kNBGfaGYc","B0yMpjuciEI","L-kYV5eW4Kw","Dn3mzSlDS8Y","7cDlloKI9s0","12kRQJ1i0rk"]},{"artist":"Vidres a la Sang","id":"UCZKSBZ8hKicoNtWdq1hzTfw","ids":["3XpiqGQo_TY","uk_I27zGjDQ","-kOpSJrlc0c","iTkNa_QhdDA","93D_sgf_gyg","PRXAjZMkuVY","XBbiMKCBkhE","4yuO13Qrf2Q","S57e56ZHms4","ZfylFQuKAp8","OXcar9vGJp4","8CjGZUZCJGk","pqeItxb98-8","hMjVbpaGhO4","QjUszAnOOdw","UVa3_332Umw","YADk6ofSX3Y","Ohpn1bC8v9I","YnDJIqBaqq0","H9PBv400f_M","ZP-vV-pxynw","EItmNHHieJY","y452wMrfSpk","mLDvuaRUczo"]},{"artist":"Foscor","id":"UCpWzqKujkmJvGIAt5QgBgBQ","ids":["pAFRiQG2GGE","MczB5GZDVYI","ACFjh9DBSDQ","7gUY6dQW7pU","N4S20UP17qY","VCZMYUVlP2g","LFqMEiR_R5c","oXGCMzL_s_g","sMGw3tby7Uo","GlmSA-GI4kI","TP91vIrZ2bk","P_bT3kG66j4","gs-o-L3h0nA","7akPkTH2YNQ","16MSezM_N5M","2Da3wPx5SCY","prqO9w7YMo8","Sgo1W8eSvqY","nLV4I0ulx48","joxVDK86hkM","pdkJn3RGxb8","h_gLSUYw2k4","Y4Uio11mKmg","xb0qy-hkaQs","af092zeSnm4","frZleW_n3UM","u-uVsC_HGHU","Ll-BbcxeyFo","7UbtKla8UJk","qMejtwR_bZ0","1NUUf0_eJ6s","fvdIVxtkxXI","YYN9A-9c4cs","4cgUQfZ42TA","eizOXtQlNNg","i0K6Ll0mOZ0","RrcScejooLQ","D6Dkhgo952o","mtYlpomkWNs","StcRKHdMzCA","SMDVRxTq_A8","7sidXSX4x0k"]},{"artist":"Moksha","id":"UC3uMAvZMHLOMo3OSDjqAVYQ","ids":["qKsmlSDEIV4","N884AOAQpGc","0sIX2iW_v-E","x6sHMcLvo3Y","p0kle4Jwxu8","HSk43_35hzs","bqEHHfaPojs","xJTeL511gE8","E-UvVSI_clU","rKbtwFIpP54"]},{"artist":"Sota Terra","id":"UCUTor5MG45HnmxOEc2HrUhA","ids":["4BaYCchQmws","7t9uO1XQJik","qlV_W_ECgH8","W2-BBPl2LVA","127tggsWCbQ","BTmJ6YnVZ4U","LiYCC-GlwyQ","NBzaWMBnzsA","SW31YPTggOQ","Tqn2bFbhvUk","bvToD3TO7O0","wEkgEx4AoW4","UDVrVCdYdOc","hIJDi8LzEAY","c_ri4uqPYjU","vAOZLWO4FuQ","2LkJut3VlTk","EzrS6eznCY4","GNoFc1wrOCc","CLt9rh2xRK0","EI1mjW1Lgs4","PQpUWJTcYBU","TanPkCklENo"]},{"artist":"Korruption Found","id":"UCCNmteQmEPFZTuM8joXB2Vw","ids":["7c1kMwaaAMY","1h4IpBXyP08","Od