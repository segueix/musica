name: Verificar resultat grup 5
on:
  workflow_run:
    workflows: ["Actualitzar feed musical"]
    types: [completed]
permissions:
  contents: read
jobs:
  verifica:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Comprova seleccio i exclusions
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const specs=[{"artist":"Mr. Freak Ska","id":"UCElR_cmETBNoC7Rs6STl0BA","type":"topic","ids":["YLAAi2Vy-9w","okNB7ZwJtSs","GZR_Wt1vK70","EjiL2iRWSmM","7bI26VFGyr0","M1y0jB6fWu0","8DCiSkzZQjg","mPQTy1Dl3eg","fyL5Ka1fe2I","iG7kTOBbld0","w7a2qqISTzY","Vw3NC_vMfs0","zFJD9cfAoBQ","JAU-kIW8tIA","W0JX1PYGVoc","98bp4kye1PY","LrcB_a1dBYc","ytVuJb6YaBk","thOFqL3nldA","4WSF6lF_GRI","8r40vnOUwFU","VvvOUyGHzz4","jyZZ7XH6dRw","Q0ZqYm04dLE","LwRDJ4kbzbA","S3gbQ37grls","Lx3GSy0L2hA","dHhHiNibpFc","c4p_dUcvl1s","TPf6xKtYUpo","_ciKs_pmDIk","ZlDmFVAR9Io","TbEDob8E_3M","3-hNPr8WoFg","PlljlImOqKs","5gTFoR_qCVk","UMtVk6pDuiU","BA31T58ho40","pI6JmEkvq60","bH5XcOd-NjY"]},{"artist":"Miquel Gil","id":"UCrTJ5_xgCZyb-Rt3dp1eUxg","type":"topic","ids":["rlm_AoYwGHE","2pQCE9TXBxU","YoVyDgt_Dxg","dDOM42Frpr0","XqYXyWtyWKs","0gU-8yAL2cg","3-RLclVCpuQ","aUlky9F2PKA","J9G5WbVblXo","oC87C3yQEu0","E67vqQMTLYY"]},{"artist":"Mendra","id":"UCokFPjgxi7i2ONsHr8wHj6g","type":"topic","ids":["pnBszIag64U","7Wzf3EZ0fG4","K8HKCJzhwoU","t21g-bOCFy0","slQ8MzfTIuY"]},{"artist":"Mendra","id":"UCtTPgp6W1WefOGfV3maG7JA","type":"topic","ids":["7zcy83j0GuI","InSd11YRwXE"]}];
          const feed=JSON.parse(fs.readFileSync('data/feed.json','utf8'));
          const found=new Map();
          function walk(o){ if(!o||typeof o!=='object') return; if(typeof o.id==='string'&&specs.some(s=>s.ids.includes(o.id)||s.id===o.channelId)) found.set(o.id,o); for(const v of Object.values(o))if(v&&typeof v==='object')walk(v); }
          walk(feed);
          function files(dir){if(!fs.existsSync(dir))return;for(const e of fs.readdirSync(dir,{withFileTypes:true})){const p=dir+'/'+e.name;if(e.isDirectory())files(p);else if(p.endsWith('.json'))walk(JSON.parse(fs.readFileSync(p,'utf8')));}}
          files('data/archive');
          const allAllowed=new Set(specs.flatMap(s=>s.ids));
          for(const s of specs){const missing=s.ids.filter(id=>!found.has(id)); console.log(JSON.stringify({artist:s.artist,channel:s.id,expected:s.ids.length,missing}));assert.equal(missing.length,0,'Vídeos absents');}
          for(const [id,v]of found)if(specs.some(s=>s.id===v.channelId))assert(allAllowed.has(id),'Vídeo no autoritzat '+id);
          const a=JSON.parse(fs.readFileSync('data/artistes-musica.json','utf8'));for(const name of ['La Cobla','Quatre Parets'])assert.equal(a.artists.find(a=>a.name===name).active,false);
          console.log('GRUP_5_OK '+allAllowed.size+' vídeos; La Cobla i Quatre Parets pendents; selecció exacta.');
          NODE
