name: Verificar metall grup 2
on:
  workflow_run:
    workflows: ["Actualitzar feed musical"]
    types: [completed]
permissions:
  contents: read
jobs:
  verifica:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
      - name: Comprova seleccio i exclusions
        run: |
          node - <<'NODE'
          const fs=require('fs'),assert=require('assert');
          const specs=[{"artist":"Entropia","id":"UCT-wRacXWBQKqr1z6ZGoubw","ids":["XGTVyuIVGy8","aTWarcZRYsA"]},{"artist":"Entropia","id":"UCayj6r8npsfkvYupNj8YC4A","ids":["Th9BjzBEnrQ"]},{"artist":"Ósserp","id":"UCCmgW83QdTLEGTkEc6uyJ6Q","ids":["C9IkAfUQTkE","CM0dT4Zy4pI","CjfHzT2H2xY","LJu4JTho8gU","b3B8yY0LNwk","pEgPAfNN42E","pSLWvfk9Jq4","sIkUwV3Dbq0","vVs7x8cu2uk","CN30nxZz0bc","IPHXbRj83lg","tFHrFpK3-yA","vKnnC_nDXsI"]},{"artist":"Bocc","id":"UCR5qRB1oeWWJF8QhX7WmuXQ","ids":["ZnwKX-iMYxI","_AhMDFM9ttw","L6s-SQqblQE","-7fnIWhEhXA","wniV8oEQT0k","plJLcSL1mik","KwNcIdMdnBg","NtFIjn78lzE","ODIX6a_e0Z4","2qOBu8y6Tq8","2h_jEGLE0yw","E3yYPutOx_Y","ElOwLz4YMgs","7XHaJUkY1n8","7um2Be4KAbE","cJuiJE4yzzo","ki7ZZtrWIXY","IytBGB8x5H0","XR1yfPxHam8","Fe8FK9TO5ZA","f88wvjaxI84","W0O_2SK2m0A","5gR_NkVnMN4","hdFHPUYbwBE","j7xXBGcFX9E","KjqC7gMn5HY","0FsoSlhJq34","sB2gQeGRWfk","Zq_Bk56Drrw","poUwVGHRpl0","E5wTIXaceaY","fvOR2vXBzVQ","RjcfQGBIWNk","z474isVpx6I","8PgdVMpWn9E","rt5pii5v7cs","Ff3wdjFRVxc","xZpuS0GOTD0","MomL6WizUDk","0sW5BBR7JTA","bltVEh5YLuo","XfbE80xxWYs","nIH_Ji-dCVE","dxf2378gEkA","Z5y14tqIYRo","2ogYYSjzph4","Nb6jgyEr-rs","OjMeFmcRWBQ","hr7FslhbMzk","Vzdzq6R4uaQ","n7T9SsqBiiE","wMBj6OUpvqs","5FZfzZvTXVM"]},{"artist":"Falç de Fetillera","id":"UCgVBViL3I9YWFVBHIyvcpjg","ids":["VMcBZ2w4WP4","6vxPERj3W6U","bmo1tvlwffc","sA_NcRNbeQA","iwcKYIQSnok","7GnXTwcpsc0","9dZXv1e7zTU","uuvED4IWOYs","W1hPN8-LIaE","VL0lpK8LGWw","eeqLklHc6ws","G-ns72AUj1E","9wvllOlVrR0"]},{"artist":"Falç de Fetillera","id":"UC8GlOjZpZMKHieUbeJ9eh7g","ids":["IC3S3X35_M4","V3xf0sQc02o","o7cKsUEP398","ZaJtD5f7o6g","ntiR8TEKagI","zfBO2Rd92Do","GNjotmKaOOs","3TZpwe3RHIU","pKoz6ezl4wM","cgy_9NiZvQk","sWBTSGGr85k","EXFn5epnKjk","_iKRO23EM3g","pVqOvTDu3nw","3QqRdmmv3E0","sUelxJgpE3g","4KYBDkbgksM","VBThn-d6TIA","hpun9M00Ncs","kno3FuWTk4A","u-kHq2ZPjH0"]},{"artist":"Udol","id":"UCQz3jf86vHTtfVwXd-rOSrA","ids":["0Oxj-YIuIIM","TofPmLuy8Fs"]},{"artist":"Udol","id":"UCrxpjvY7G2ffEklcmSHm5og","ids":["2sQH2iiL