name: Incorporar grup urba 1

on:
  push:
    branches: [main]
    paths: ['.github/workflows/revisar-urban-grup1.yml']
  workflow_dispatch:

concurrency:
  group: music-data-writer
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  incorporar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Prepara les dades i els controls
        run: |
          npm ci
          echo "EDITORIAL_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          cp js/channels-ca.json /tmp/urban1-channels-before.json
          node --check scripts/revisions/incorporar_urban_grup1.js
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const {technicalReason,seconds}=require('./scripts/revisions/incorporar_urban_grup1.js');
          const p=JSON.parse(fs.readFileSync('docs/revisions/2026-10-13-urban1-seleccio.json','utf8'));
          assert.deepEqual(p.artists.map(a=>a.name),['Neisha','AVANT','Xisk','Fortuu','Aina Koda']);
          const channels=p.artists.flatMap(a=>a.channels.map(c=>c.id));
          assert.equal(new Set(channels).size,9);
          const banned=new Set(p.languageExclusions.flatMap(e=>e.ids));
          for(const a of p.artists){
            assert.equal(a.channels.filter(c=>c.primary).length,1);
            for(const c of a.channels)for(const id of c.ids.split(/\s+/)){assert(/^[A-Za-z0-9_-]{11}$/.test(id));assert(!banned.has(id));}
          }
          const sample={id:'b8cVyaRZoco',channelId:channels[0],embeddable:true,duration:'PT1M9S'};
          assert.equal(technicalReason(sample,channels[0]),null);
          assert(technicalReason({...sample,embeddable:false},channels[0]));
          assert(technicalReason(sample,'wrong-uploader'));
          assert(technicalReason({...sample,regionRestriction:{blocked:['ES']}},channels[0]));
          assert(technicalReason({...sample,duration:'PT1H'},channels[0]));
          assert.equal(seconds('PT1M9S'),69);
          console.log('Identitats, exclusions, durades i editors comprovats.');
          NODE
      - name: Aplica nomes les cinc altes
        run: |
          node scripts/revisions/incorporar_urban_grup1.js
          node scripts/documentar_vigilancia_idiomes.js
          npm run music:validate
      - name: Sincronitza exclusivament els nou canals seleccionats
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: '50'
          MUSIC_TOPIC_GOVERNANCE: 'apply'
          MUSIC_TOPIC_FULL_READ: '1'
        run: |
          test -n "$MUSIC_TARGET_CHANNELS"
          node scripts/update_music_feed.js
      - name: Regenera arxiu, cerca i pagines compartides
        run: |
          node scripts/archivar_feed_musical.js
          npm run search:index:hybrid:rebuild
          node scripts/generar_pagines_compartir.js
          node scripts/documentar_vigilancia_idiomes.js
          node scripts/documentar_vigilancia_idiomes.js --check
      - name: Verifica proves i lint sense regressions
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const source=fs.readFileSync('scripts/revisions/provar_altes_musicals.js','utf8');
          const old='docs/revisions/2026-10-12-tardor-blat-quinto.json';
          if(!source.includes(old))throw Error('El verificador ha canviat; cal revisar-lo');
          fs.writeFileSync('scripts/revisions/.provar-urban1-temporal.js',source.replace(old,'docs/revisions/2026-10-13-urban1-alta.json'));
          NODE
          node scripts/revisions/.provar-urban1-temporal.js
          rm scripts/revisions/.provar-urban1-temporal.js
          node scripts/revisions/verificar_lint_pepet.js
      - name: Comprova les publicacions i preserva el cataleg anterior
        run: |
          node scripts/revisions/incorporar_urban_grup1.js --verify
          node - <<'NODE'
          const fs=require('node:fs');
          const r=JSON.parse(fs.readFileSync('docs/revisions/2026-10-13-urban1-alta.json','utf8'));
          if(r.validation.regressions || r.lint.newDiagnostics)throw Error('Hi ha regressions');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,fs.readFileSync('docs/revisions/2026-10-13-urban1-alta.md','utf8'));
          NODE
      - name: Publica sense sobreescriure canvis concurrents
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EDITORIAL_BASE_SHA"
          git add data js/channels-ca.json compartir docs/revisions/2026-10-13-urban1-alta.json docs/revisions/2026-10-13-urban1-alta.md docs/ARTISTES_VIGILATS_IDIOMA.md
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'data: indexa Neisha, AVANT, Xisk, Fortuu i Aina Koda'
            git push origin HEAD:main
          fi
      - name: Prepara el lloc estatic actualitzat
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests _site/scripts _site/functions _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplega les cinc altes
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Conserva el resum i les comprovacions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urban1-resultat
          retention-days: 1
          path: |
            docs/revisions/2026-10-13-urban1-alta.json
            docs/revisions/2026-10-13-urban1-alta.md
            /tmp/tardor-blat-quinto-validation.json
            /tmp/tardor-blat-quinto-tests.json
            /tmp/pepet-lint-summary.json
