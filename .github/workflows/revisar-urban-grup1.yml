name: Precisar origen del grup urba 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/revisar-urban-grup1.yml']
  workflow_dispatch:
concurrency:
  group: music-data-writer
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  origen:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Prepara la verificacio
        run: |
          npm ci
          echo "EDITORIAL_BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Precisa el municipi sense consultar YouTube
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const assert=require('node:assert/strict');
          const crypto=require('node:crypto');
          const read=f=>JSON.parse(fs.readFileSync(f,'utf8'));
          const write=(f,v)=>fs.writeFileSync(f,JSON.stringify(v,null,2)+'\n');
          const norm=s=>String(s||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase();
          const hash=f=>crypto.createHash('sha256').update(fs.readFileSync(f)).digest('hex');
          (async()=>{
            const protectedFiles=['data/feed.json','js/channels-ca.json','data/music-channel-video-allowlist.json','data/hidden-videos.json'];
            const protectedBefore=protectedFiles.map(hash);
            const source='https://www.firab.org/ca/programacion/562/';
            const originFile='data/origens-artistes.json';
            const origins=read(originFile);
            const prior=JSON.parse(JSON.stringify(origins));
            const entries=Object.entries(origins.artists).filter(([,a])=>a.name==='Xisk');
            assert.equal(entries.length,1);
            const [artistId,artist]=entries[0];
            let place=Object.entries(origins.places).find(([,p])=>p.type==='municipality'&&norm(p.name)==='marratxi');
            if(!place){
              for(const name of ['Marratxí','Marratxi']){
                const u=new URL('https://geocoding-api.open-meteo.com/v1/search');
                for(const[k,v]of Object.entries({name,count:10,language:'ca',format:'json',countryCode:'ES'}))u.searchParams.set(k,String(v));
                const response=await fetch(u,{signal:AbortSignal.timeout(30000)});
                assert(response.ok,'Geocodificació no disponible');
                const results=(await response.json()).results||[];
                const p=results.find(p=>norm(p.name)==='marratxi'&&p.country_code==='ES'&&/^PPL/.test(p.feature_code));
                if(!p)continue;
                assert(p.latitude>39.5&&p.latitude<39.8&&p.longitude>2.6&&p.longitude<3);
                const id='geonames:'+p.id;
                assert(!origins.places[id],'Municipi amb identificador que cal reconciliar');
                const value={name:'Marratxí',type:'municipality',geonamesId:p.id,coordinates:{latitude:p.latitude,longitude:p.longitude,precision:'settlement_reference'},territory:'Illes Balears',source:u.href,checkedOn:'2026-10-13'};
                origins.places[id]=value;place=[id,value];break;
              }
            }
            assert(place,'No es pot identificar el municipi de Marratxí');
            artist.placeIds=[place[0]];
            artist.basis='Xisca Garau és originària de Pòrtol, nucli del municipi de Marratxí. La fitxa de Fira B! de l’Institut d’Estudis Baleàrics acredita Pòrtol. El mapa utilitza la referència municipal de Marratxí, no Palma ni una coordenada inventada del nucli.';
            artist.sources=[source,'https://www.mtxi.es/xisk-revolucio-electronica-amb-accent-portola/'];
            artist.reviewedOn='2026-10-13';
            assert.equal(artist.relation,'origin');
            for(const[id,a]of Object.entries(prior.artists))if(id!==artistId)assert.deepEqual(origins.artists[id],a);
            assert.deepEqual(origins.channels,prior.channels);
            origins.updatedAt=new Date().toISOString();
            const selectionFile='docs/revisions/2026-10-13-urban1-seleccio.json';
            const selection=read(selectionFile),config=selection.artists.find(a=>a.name==='Xisk');
            config.place='Marratxí';config.locality='Pòrtol';config.placeAliases=['Marratxí','Marratxi'];config.placeId=place[0];config.bounds=[39.5,39.8,2.6,3];config.originSource=source;config.basis=artist.basis;
            config.sources=[...new Set([...config.sources,source])];
            const reportFile='docs/revisions/2026-10-13-urban1-alta.json';
            const report=read(reportFile),entry=report.artists.find(a=>a.name==='Xisk');
            entry.place='Pòrtol (Marratxí)';entry.municipality='Marratxí';entry.originPlaceId=place[0];entry.sources=[...new Set([...entry.sources,source])];
            report.originCorrection={artist:'Xisk',previous:'Palma',locality:'Pòrtol',municipality:'Marratxí',source,checkedAt:new Date().toISOString()};
            const summaryFile='docs/revisions/2026-10-13-urban1-alta.md';
            const summary=fs.readFileSync(summaryFile,'utf8');
            assert(summary.includes('Xisk — Palma')||summary.includes('Xisk — Pòrtol (Marratxí)'));
            write(originFile,origins);write(selectionFile,selection);write(reportFile,report);
            fs.writeFileSync(summaryFile,summary.replace('Xisk — Palma','Xisk — Pòrtol (Marratxí)'));
            assert.deepEqual(protectedFiles.map(hash),protectedBefore);
            assert.equal(report.publication.recordings,178);
            console.log(JSON.stringify({artist:'Xisk',locality:'Pòrtol',municipality:place[1],recordingsUnchanged:178}));
          })().catch(e=>{console.error(e.stack);process.exitCode=1;});
          NODE
      - name: Verifica origens i regenera previsualitzacions
        run: |
          npm run music:validate
          npx vitest run tests/artist-origin.test.js
          node scripts/generar_pagines_compartir.js
      - name: Desa nomes la precisio geografica i les pagines generades
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EDITORIAL_BASE_SHA"
          git add data/origens-artistes.json docs/revisions/2026-10-13-urban1-seleccio.json docs/revisions/2026-10-13-urban1-alta.json docs/revisions/2026-10-13-urban1-alta.md compartir
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'data: situa Xisk a Pòrtol amb la referència municipal de Marratxí'
            git push origin HEAD:main
          fi
      - name: Prepara el lloc corregit
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests _site/scripts _site/functions _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplega el mapa corregit
        id: deployment
        uses: actions/deploy-pages@v4
