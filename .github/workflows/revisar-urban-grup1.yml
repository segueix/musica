name: Revisar grup urba 1
on:
  push:
    branches: [main]
    paths: ['.github/workflows/revisar-urban-grup1.yml']
  workflow_dispatch:
concurrency:
  group: music-data-writer
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
      - name: Completa nomes els candidats pendents
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          (async()=>{
            const key=process.env.YOUTUBE_API_KEY_SERVER;
            if(!key)throw Error('Falta clau de YouTube');
            const norm=x=>String(x||'').normalize('NFD').replace(/\p{Diacritic}/gu,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
            let quota=0;
            async function api(resource,args){
              quota+=resource==='search'?100:1;
              const u=new URL('https://www.googleapis.com/youtube/v3/'+resource);
              for(const[k,v]of Object.entries({...args,key}))u.searchParams.set(k,String(v));
              const r=await fetch(u,{signal:AbortSignal.timeout(30000)});const j=await r.json();
              if(!r.ok)throw Error(resource+': '+(j.error?.message||r.status));return j;
            }
            const stem='docs/revisions/2026-10-13-urban1';
            const report=JSON.parse(fs.readFileSync(stem+'-descoberta.json','utf8'));
            report.artists.find(a=>a.name==='AVANT').topicStatus='No verificat: la cerca de canals retorna massa homònims. No s’incorpora cap d’aquests candidats només pel nom.';
            for(const name of ['Fortuu','Xisk']){
              const a=report.artists.find(a=>a.name===name), candidates=new Set();
              const results=(await api('search',{part:'snippet',type:'channel',q:'"'+name+'" '+(name==='Xisk'?'music':'Topic'),maxResults:12})).items||[];
              a.additionalSearch=results.map(v=>({id:v.id.channelId,title:v.snippet.title,description:v.snippet.description}));
              for(const v of results){const n=norm(v.snippet.title).replace(/ (topic|tema|music|musica|official|oficial)$/,'');if(n===norm(name))candidates.add(v.id.channelId);}
              if(name==='Xisk'){
                const v=(await api('videos',{part:'snippet',id:'XesgSl26dl0'})).items?.[0];
                if(v){a.referenceVideo={id:v.id,title:v.snippet.title,channelId:v.snippet.channelId,channelTitle:v.snippet.channelTitle};if(norm(v.snippet.channelTitle).includes('xisk'))candidates.add(v.snippet.channelId);}
              }
              for(const c of a.channels)candidates.delete(c.id);
              if(candidates.size>5){a.pendingCandidates=[...candidates];continue;}
              const channels=candidates.size?(await api('channels',{part:'snippet,contentDetails',id:[...candidates].join(',')})).items||[]:[];
              for(const c of channels){
                const videos=[];let token;
                for(let page=0;page<3;page++){
                  const p=await api('playlistItems',{part:'contentDetails',playlistId:c.contentDetails.relatedPlaylists.uploads,maxResults:50,...(token?{pageToken:token}:{})});
                  const ids=(p.items||[]).map(v=>v.contentDetails.videoId);
                  if(ids.length){const d=await api('videos',{part:'snippet,contentDetails,status,statistics',id:ids.join(',')});
                    for(const v of d.items||[])videos.push({id:v.id,title:v.snippet.title,description:v.snippet.description,channelId:v.snippet.channelId,publishedAt:v.snippet.publishedAt,duration:v.contentDetails.duration,embeddable:v.status.embeddable,viewCount:Number(v.statistics.viewCount||0),defaultAudioLanguage:v.snippet.defaultAudioLanguage||null,regionRestriction:v.contentDetails.regionRestriction||null});
                  }
                  token=p.nextPageToken;if(!token)break;
                }
                a.channels.push({id:c.id,name:c.snippet.title,handle:c.snippet.customUrl||null,description:c.snippet.description,avatar:c.snippet.thumbnails?.high?.url||'',complete:!token,videos});
                console.log(JSON.stringify({artist:name,id:c.id,name:c.snippet.title,count:videos.length,complete:!token}));
              }
            }
            report.estimatedQuotaUnits+=quota;report.checkedAt=new Date().toISOString();
            fs.writeFileSync(stem+'-descoberta.json',JSON.stringify(report,null,2)+'\n');
            for(const a of report.artists)fs.writeFileSync(stem+'-'+norm(a.name).replace(/ /g,'-')+'.json',JSON.stringify(a,null,2)+'\n');
            fs.writeFileSync(stem+'-resum.md',report.artists.map(a=>'# '+a.name+'\n'+a.channels.map(c=>'## '+c.name+' | '+c.id+' | '+c.handle+' | '+c.complete+'\n'+c.videos.map(v=>v.id+' | '+v.title+' | '+v.duration).join('\n')).join('\n')).join('\n\n')+'\n');
          })().catch(e=>{console.error(e.stack);process.exitCode=1;});
          NODE
      - name: Desa la descoberta
        run: |
          bash scripts/publicar_dades.sh 'docs: completa els canals candidats del grup urbà 1' docs/revisions/2026-10-13-urban1-*.json docs/revisions/2026-10-13-urban1-resum.md
      - uses: actions/upload-artifact@v4
        with:
          name: urban1-complet
          retention-days: 1
          path: |
            docs/revisions/2026-10-13-urban1-*.json
            docs/revisions/2026-10-13-urban1-resum.md
