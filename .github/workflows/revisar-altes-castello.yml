name: Incorporar artistes Castello
on:
  push:
    branches: [main]
    paths: ['.github/workflows/revisar-altes-castello.yml']
  workflow_dispatch:
concurrency:
  group: music-data-writer
  cancel-in-progress: false
permissions:
  contents: write
  pages: write
  id-token: write
jobs:
  incorporar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '20'
          cache: npm
      - name: Prepara i valida el script acotat
        run: |
          npm ci
          cp js/channels-ca.json /tmp/castello-channels-before.json
          node - <<'NODE'
          const fs=require('fs');
          const f='scripts/revisions/incorporar_castello_20261013.js';
          let c=fs.readFileSync(f,'utf8');
          c=c.replace('    mL3bA4OD5-w:', "    'mL3bA4OD5-w':");
          fs.writeFileSync(f,c);
          NODE
          node --check scripts/revisions/incorporar_castello_20261013.js
      - name: Aplica les tres identitats i les seleccions documentades
        run: |
          node scripts/revisions/incorporar_castello_20261013.js
          node scripts/documentar_vigilancia_idiomes.js
          npm run music:validate
          node scripts/test_music_content_classifier.js
      - name: Sincronitza nomes els vuit canals seleccionats
        env:
          YOUTUBE_API_KEY_SERVER: ${{ secrets.YOUTUBE_API_KEY_SERVER }}
          MUSIC_VIDEOS_PER_CHANNEL: '50'
          MUSIC_TOPIC_GOVERNANCE: apply
          MUSIC_TOPIC_FULL_READ: '1'
        run: |
          test -n "$MUSIC_TARGET_CHANNELS"
          node scripts/update_music_feed.js
          node scripts/aplicar_revisio_manual_musical.js > /tmp/castello-manual.log 2>&1
      - name: Regenera arxiu, cerca i pagines compartides
        run: |
          node scripts/archivar_feed_musical.js
          npm run search:index:hybrid:rebuild
          node scripts/generar_pagines_compartir.js
          node scripts/documentar_vigilancia_idiomes.js --check
      - name: Verifica les proves sense admetre regressions
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const f='scripts/revisions/provar_altes_musicals.js';
          const text=fs.readFileSync(f,'utf8').replaceAll('docs/revisions/2026-10-12-tardor-blat-quinto.json','docs/revisions/2026-10-13-castello-alta.json');
          fs.writeFileSync('scripts/revisions/.provar_castello_temporal.js',text);
          NODE
          node scripts/revisions/.provar_castello_temporal.js
          rm scripts/revisions/.provar_castello_temporal.js
      - name: Comprova registres publicables i conserva el cataleg anterior
        run: |
          node scripts/revisions/incorporar_castello_20261013.js --verify
          npm run lint > /tmp/castello-lint.log 2>&1 || echo "Avisos de lint del codi existent; s’adjunta el registre"
          node scripts/actualitzar_versio_sw.js
      - name: Publica les dades i els derivats junts
        run: |
          bash scripts/publicar_dades.sh "data: incorpora Malparlat, Xiomara Abello i Esther amb seleccio catalana" data js/channels-ca.json docs/ARTISTES_VIGILATS_IDIOMA.md docs/revisions/2026-10-13-castello-alta.json docs/revisions/2026-10-13-castello-alta.md scripts/revisions/incorporar_castello_20261013.js compartir sw.js
      - name: Prepara el lloc estatic amb el cataleg publicat
        run: |
          mkdir _site
          git archive HEAD | tar -x -C _site
          rm -rf _site/.github _site/tests _site/scripts _site/functions _site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Desplega les tres altes
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Conserva nomes el diagnostic en cas d’error
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-altes-castello
          path: |
            /tmp/tardor-blat-quinto-validation.json
            /tmp/castello-lint.log
            /tmp/castello-manual.log
            docs/revisions/2026-10-13-castello-alta.json
          retention-days: 1
