<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Administració · Segueix Música</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{margin:0;background:#111;color:#eee}
main{max-width:1400px;margin:auto;padding:24px}
h1{margin:0 0 8px}.muted{color:#aaa}.toolbar,.stats{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
button,input,select{font:inherit;border-radius:9px;border:1px solid #444;background:#1d1d1d;color:#fff;padding:9px 11px}
button{cursor:pointer}.ok{border-color:#397d45}.bad{border-color:#8e3d3d}
.stat{background:#1b1b1b;border:1px solid #333;border-radius:10px;padding:10px 14px}
table{width:100%;border-collapse:collapse;background:#181818}
th,td{text-align:left;border-bottom:1px solid #303030;padding:10px;vertical-align:top}
th{position:sticky;top:0;background:#222;z-index:1}
.tag{display:inline-block;border:1px solid #444;border-radius:999px;padding:2px 7px;margin:1px;font-size:.8rem}
.actions{display:flex;gap:5px;flex-wrap:wrap}
a{color:#9cc9ff}.missing{color:#ffbd66}.approved{color:#80db91}.rejected{color:#ff8f8f}
@media(max-width:850px){.hide-mobile{display:none}main{padding:12px}th,td{padding:8px 5px;font-size:.9rem}}
</style>
</head>
<body>
<main>
<h1>Segueix Música · administració d'artistes</h1>
<p class="muted">Les decisions es guarden al navegador fins que exportis el JSON. L'automatisme de descoberta no sobreescriu aprovacions ni rebutjos.</p>
<div class="stats" id="stats"></div>
<div class="toolbar">
<input id="q" type="search" placeholder="Cerca artista…">
<select id="status">
<option value="">Tots els estats</option>
<option value="pendent">Pendents</option>
<option value="aprovat">Aprovats</option>
<option value="rebutjat">Rebutjats</option>
</select>
<select id="youtube">
<option value="">Amb i sense YouTube</option>
<option value="yes">Amb YouTube ID</option>
<option value="no">Sense YouTube ID</option>
</select>
<button id="exportJson">Descarrega JSON revisat</button>
<button id="exportCsv">Descarrega CSV</button>
<button id="reset">Descarta canvis locals</button>
</div>
<div style="overflow:auto">
<table>
<thead><tr><th>Artista</th><th>Estat</th><th>YouTube</th><th class="hide-mobile">MusicBrainz</th><th class="hide-mobile">Evidència</th><th>Accions</th></tr></thead>
<tbody id="rows"></tbody>
</table>
</div>
</main>
<script>
const DATA_URL='data/artistes-musica.json';
const STORAGE='segueix_musica_admin_draft_v1';
let db=null;

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function save(){localStorage.setItem(STORAGE,JSON.stringify(db));render()}
function download(name,text,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function setStatus(qid,status){const a=db.artists.find(x=>x.wikidataId===qid);if(!a)return;a.reviewStatus=status;a.active=status==='aprovat';save()}
function stats(){
 const a=db.artists;const n=s=>a.filter(x=>x.reviewStatus===s).length;
 document.getElementById('stats').innerHTML=[
  ['Total',a.length],['Pendents',n('pendent')],['Aprovats',n('aprovat')],['Rebutjats',n('rebutjat')],
  ['Amb YouTube',a.filter(x=>x.youtube?.channels?.length).length],['Sense YouTube',a.filter(x=>!x.youtube?.channels?.length).length],
  ['Candidats MB',a.filter(x=>x.youtube?.candidates?.length).length]
 ].map(x=>'<div class="stat"><b>'+x[1]+'</b><br><span class="muted">'+x[0]+'</span></div>').join('');
}
function render(){
 stats();
 const q=document.getElementById('q').value.toLocaleLowerCase('ca');
 const status=document.getElementById('status').value;
 const yt=document.getElementById('youtube').value;
 const rows=db.artists.filter(a=>{
  if(q&&!a.name.toLocaleLowerCase('ca').includes(q))return false;
  if(status&&a.reviewStatus!==status)return false;
  const has=!!a.youtube?.channels?.length;
  if(yt==='yes'&&!has)return false;if(yt==='no'&&has)return false;return true;
 }).map(a=>{
  const chans=a.youtube?.channels||[];
  const mbCandidates=a.youtube?.candidates||[];
  const ytHtml=chans.length
   ? chans.map(c=>'<a href="https://www.youtube.com/channel/'+esc(c.id)+'" target="_blank">'+esc(c.id)+'</a>').join('<br>')
   : mbCandidates.length
     ? mbCandidates.map(c=>'<a href="'+esc(c.url)+'" target="_blank">'+esc(c.handle||'candidat MusicBrainz')+'</a>').join('<br>')
     : '<span class="missing">pendent</span>';
  const evidence=(a.sources||[]).filter(s=>s.startsWith('wikidata:')).map(s=>'<span class="tag">'+esc(s.replace('wikidata:',''))+'</span>').join(' ');
  const stateClass=a.reviewStatus==='aprovat'?'approved':a.reviewStatus==='rebutjat'?'rejected':'';
  return '<tr><td><b>'+esc(a.name)+'</b><br><a href="https://www.wikidata.org/wiki/'+esc(a.wikidataId)+'" target="_blank">'+esc(a.wikidataId)+'</a></td>'+
  '<td class="'+stateClass+'">'+esc(a.reviewStatus)+'</td><td>'+ytHtml+'</td>'+
  '<td class="hide-mobile">'+(a.musicbrainzId?'<a href="https://musicbrainz.org/artist/'+esc(a.musicbrainzId)+'" target="_blank">'+esc(a.musicbrainzId)+'</a>':'—')+'</td>'+
  '<td class="hide-mobile">'+evidence+'</td><td><div class="actions">'+
  '<button class="ok" onclick="setStatus(\''+esc(a.wikidataId)+'\',\'aprovat\')">Aprova</button>'+
  '<button onclick="setStatus(\''+esc(a.wikidataId)+'\',\'pendent\')">Pendent</button>'+
  '<button class="bad" onclick="setStatus(\''+esc(a.wikidataId)+'\',\'rebutjat\')">Rebutja</button>'+
  '</div></td></tr>';
 }).join('');
 document.getElementById('rows').innerHTML=rows||'<tr><td colspan="6">No hi ha resultats.</td></tr>';
}
async function load(){
 const remote=await fetch(DATA_URL,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(r.status);return r.json()});
 const draft=localStorage.getItem(STORAGE);
 if(draft){
  try{const parsed=JSON.parse(draft);db=parsed.schemaVersion===remote.schemaVersion?parsed:remote}catch{db=remote}
 }else db=remote;
 render();
}
document.getElementById('q').addEventListener('input',render);
document.getElementById('status').addEventListener('change',render);
document.getElementById('youtube').addEventListener('change',render);
document.getElementById('reset').addEventListener('click',()=>{localStorage.removeItem(STORAGE);location.reload()});
document.getElementById('exportJson').addEventListener('click',()=>{db.updatedAt=new Date().toISOString();download('artistes-musica.json',JSON.stringify(db,null,2)+'\n','application/json')});
document.getElementById('exportCsv').addEventListener('click',()=>{
 const cols=['name','reviewStatus','active','wikidataId','musicbrainzId','youtubeIds','youtubeCandidates','confidence'];
 const lines=[cols.join(',')].concat(db.artists.map(a=>[a.name,a.reviewStatus,a.active,a.wikidataId,a.musicbrainzId||'',(a.youtube?.channels||[]).map(c=>c.id).join('|'),(a.youtube?.candidates||[]).map(c=>c.url).join('|'),a.confidence].map(v=>'"'+String(v).replaceAll('"','""')+'"').join(',')));
 download('artistes-musica.csv',lines.join('\n')+'\n','text/csv;charset=utf-8');
});
load().catch(e=>document.getElementById('rows').innerHTML='<tr><td colspan="6">Error carregant la base: '+esc(e.message)+'</td></tr>');
</script>
</body>
</html>
